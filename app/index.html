<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapisnici sastanaka — IMH i IDSS</title>
<style>
:root{
  --idss:#035EA1; --idss2:#08ABE6; --imh:#9F633F; --imh2:#2CB14D;
  --ink:#1b1b1b; --mut:#5b5b5b; --line:#d6d6d6; --bg:#f6f6f4; --card:#fff; --acc:#035EA1;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Century Gothic","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
header.top{background:#000;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
header.top .sp{flex:1}
header.top button{background:transparent;color:#fff;border:1px solid #777}
.stripe{height:4px;background:linear-gradient(90deg,var(--idss) 0 50%,var(--imh) 50% 100%)}
nav.tabs{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
nav.tabs button{background:#e8e8e5;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--card);font-weight:600}
main{background:var(--card);margin:0 20px 40px;border:1px solid var(--line);padding:22px;min-height:60vh}
h2{margin:0 0 14px;font-size:20px;color:var(--acc)}
h3{margin:22px 0 8px;font-size:15px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:6px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{background:#f0f0ee;color:#333}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--acc)}
button.dng{background:#a32020;border-color:#a32020}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;background:#fcfcfb}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff}
.b-IDSS{background:var(--idss)}.b-IMH{background:var(--imh)}.b-ZAJEDNICKI{background:#222}
.st-nacrt{background:#b36b00}.st-potvrdjen{background:#2a7d3d}.st-snimanje,.st-obrada{background:#555}
.note{background:#fff8e1;border:1px solid #e6cf85;padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.ok{background:#eef8ef;border-color:#9cc9a3}
table{border-collapse:collapse;width:100%;margin:6px 0}
@media screen and (max-width:700px){table{display:block;overflow-x:auto;max-width:100%}td,th,b,h1,h2,h3,p,div,span,label{overflow-wrap:anywhere}}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--acc);color:#fff;font-weight:600}
td input,td select,td textarea{border:none;padding:3px;min-height:0;background:transparent}
.rec{display:flex;align-items:center;gap:16px;margin:16px 0;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:#a32020;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.time{font-size:30px;font-variant-numeric:tabular-nums}
.muted{color:var(--mut);font-size:13px}
.hide{display:none!important}
.small{font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#print{display:none}
@media print{
  body{background:#fff}
  header.top,.stripe,nav.tabs,main{display:none!important}
  #print{display:block;padding:0 10mm}
  #print table th{background:var(--acc)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .foot{position:fixed;bottom:0;left:10mm;right:10mm;border-top:2px solid var(--acc);font-size:10px;padding-top:4px}
}
</style>
</head>
<body>
<header class="top">
  <h1>Zapisnici sastanaka — IMH i IDSS</h1>
  <span class="sp"></span>
  <span id="who" class="small"></span>
  <button id="logout" class="hide">Odjava</button>
</header>
<div class="stripe"></div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="print"></div>

<script>/* Poziv Gemini API-ja direktno iz preglednika, s rotacijom više ključeva.
   Ključevi se čitaju iz Firestorea (config/gemini) samo za korisnike s ulogom direktor/uprava i drže se samo u memoriji. */
(function(root){
'use strict';
const BASE = 'https://generativelanguage.googleapis.com/v1beta';
const INLINE_MAX = 14 * 1024 * 1024; // zapis u zahtjevu (base64) mora ostati ispod ~20 MB
const NACINI = ['Javno', 'Tajno', 'Bez glasanja'];

/* ---------- rotacija ključeva (round-robin; odmor pri 429/5xx; neispravan ključ se isključuje) ---------- */
class KeyRing {
  constructor(raw, now = () => Date.now()) {
    this.keys = String(raw || '').split(/[\s,;]+/).map(k => k.trim()).filter(Boolean);
    if (!this.keys.length) throw new Error('Nema postavljenih Gemini ključeva.');
    this.now = now;
    this.next = Math.floor(Math.random() * this.keys.length);
    this.restUntil = new Array(this.keys.length).fill(0);
    this.dead = new Array(this.keys.length).fill(false);
  }
  pick(excluded) {
    const n = this.keys.length, t = this.now();
    for (let k = 0; k < n; k++) {
      const i = (this.next + k) % n;
      if (excluded.has(i) || this.dead[i] || this.restUntil[i] > t) continue;
      this.next = (i + 1) % n; return i;
    }
    let best = -1;
    for (let i = 0; i < n; i++) {
      if (excluded.has(i) || this.dead[i]) continue;
      if (best < 0 || this.restUntil[i] < this.restUntil[best]) best = i;
    }
    if (best >= 0) this.next = (best + 1) % n;
    return best;
  }
  async run(fn) {
    const tried = new Set(); let last;
    for (let attempt = 0; attempt < this.keys.length; attempt++) {
      const i = this.pick(tried); if (i < 0) break; tried.add(i);
      try { return await fn(this.keys[i], i); }
      catch (e) {
        last = e; const s = e && e.status;
        if (s === 429) this.restUntil[i] = this.now() + 60000;
        else if (s === 500 || s === 502 || s === 503 || s === 504 || (e && e.name === 'TimeoutError')) this.restUntil[i] = this.now() + 15000;
        else if (s === 401 || s === 403 || (s === 400 && e.keyInvalid)) this.dead[i] = true;
        else throw e;
      }
    }
    throw last || new Error('Nijedan Gemini ključ nije raspoloživ.');
  }
}

/* ---------- poziv ---------- */
async function generate(key, model, body, timeoutMs, fetchFn) {
  const r = await fetchFn(`${BASE}/models/${model}:generateContent`, {
    method: 'POST', headers: { 'x-goog-api-key': key, 'content-type': 'application/json' },
    body: JSON.stringify(body), signal: AbortSignal.timeout(timeoutMs) });
  if (!r.ok) {
    const t = (await r.text()).slice(0, 400);
    const e = new Error('Gemini: ' + r.status); e.status = r.status; e.keyInvalid = /API_KEY_INVALID|API key not valid/i.test(t); throw e;
  }
  const j = await r.json(); const c = j.candidates && j.candidates[0];
  const text = ((c && c.content && c.content.parts) || []).map(p => p.text || '').join('');
  return { text, finishReason: c && c.finishReason, blocked: j.promptFeedback && j.promptFeedback.blockReason };
}

function blobToBase64(blob) {
  return new Promise((ok, no) => { const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.onerror = () => no(fr.error); fr.readAsDataURL(blob); });
}

function sttPrompt(lang) {
  return `Transkribuj ovaj snimak sastanka doslovno, na jeziku: ${lang === 'en' ? 'engleski' : 'bosanski (latinica; zadrži govorne oblike i kolokvijalizme onako kako su izgovoreni)'}.
Početak svakog novog govornika stavi u novi red u obliku "Govornik 1:", "Govornik 2:" itd. (ne izmišljaj imena; ime upiši samo ako ga neko izričito izgovori kao obraćanje).

const PROMPT = `Ti si zapisničar. Iz transkripta sastanka popuni nacrt zapisnika na bosanskom jeziku (latinica; bez srbizama i hrvatizama: piši "tačka", "zaposleni", "sastanak", "zaključak", "sedmica", "hiljada").

Stroga pravila:
1. Ništa ne upisuj što nije izrečeno u transkriptu. Ne izmišljaj imena, brojeve, rokove ni odluke.
2. Za nejasno mjesto ili nepouzdan dio upiši "[nejasno]".
3. Rok upiši kao datum samo ako je izgovoren tačan datum; za neodređene rokove ("do petka", "uskoro") rok ostavi prazan "" i navedi ga u tekstu zadatka. Odgovornu osobu upiši samo ako je izričito dogovorena; inače "".
4. Razvrstaj raspravu po tačkama dnevnog reda (po rednom broju iz liste). Piši sažeto, u trećem licu, književnim jezikom (bez kolokvijalizama). Ako dio razgovora ne pripada nijednoj tački, izostavi ga.
5. Rezultat glasanja (za/protiv/suzdržani) upiši samo ako je izrečen, kao brojeve.
6. Zadatak je samo ono što je izričito dogovoreno kao obaveza neke osobe; mišljenja i ideje nisu zadaci.
Vrati ISKLJUČIVO JSON ovog oblika:
{"tacke":[{"rasprava":"","za":"","protiv":"","suzdrzani":"","nacin":"Javno|Tajno|Bez glasanja","zakljucak":"","izdvojeno":""}],

function validDatum(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  const d = new Date(s + 'T00:00:00Z');
  return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === s ? s : '';
}
function parseJson(txt) {
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Model nije vratio ispravan odgovor.');
  try { return JSON.parse(txt.slice(a, b + 1)); } catch (e) { throw new Error('Model nije vratio ispravan odgovor.'); }
}

// dijelovi: [{blob, mime}] — svaki dio je samostalan audio fajl
async function transkribuj(ring, dijelovi, lang, o = {}) {
  const model = o.model || 'gemini-2.5-flash', fetchFn = o.fetch || root.fetch.bind(root), izlaz = [];
  for (let i = 0; i < dijelovi.length; i++) {
    const d = dijelovi[i];
    if (d.blob.size > INLINE_MAX) throw new Error('Dio snimka ' + (i + 1) + ' je prevelik (' + Math.round(d.blob.size / 1048576) + ' MB; najviše 14 MB). Podijelite zapis na kraće dijelove.');
    const data = await blobToBase64(d.blob);
    const t = await ring.run(async (key) => {
      const out = await generate(key, model, {
        contents: [{ role: 'user', parts: [{ text: sttPrompt(lang) }, { inline_data: { mime_type: d.mime, data } }] }],
        generationConfig: { temperature: 0, maxOutputTokens: 65000 } }, 300000, fetchFn);
      if (out.finishReason === 'MAX_TOKENS') throw new Error('Transkript dijela ' + (i + 1) + ' je predug.');
      if (!out.text.trim()) throw new Error('Prazan transkript dijela ' + (i + 1) + (out.blocked ? ' (' + out.blocked + ')' : '') + '.');
      return out.text.trim();
    });
    izlaz.push(t);
    if (o.napredak) o.napredak(i + 1, dijelovi.length);
  }
  return izlaz.join('\n');
}

async function nacrt(ring, transkript, dnevni, o = {}) {
  const model = o.model || 'gemini-2.5-flash', fetchFn = o.fetch || root.fetch.bind(root);
  const korisnik = `Dnevni red:\n${dnevni.map((d, i) => `${i + 1}. ${d}`).join('\n')}\n\n<transkript>\n${transkript}\n</transkript>`;
  const out = await ring.run((key) => generate(key, model, {
    systemInstruction: { parts: [{ text: PROMPT }] }, contents: [{ role: 'user', parts: [{ text: korisnik }] }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.1, maxOutputTokens: 32000 } }, 240000, fetchFn));
  if (out.finishReason === 'MAX_TOKENS') throw new Error('Nacrt je predug i nije završen. Sastanak je potrebno obraditi u dijelovima.');
  return parseJson(out.text);
}

// Provjera i očišćeno spajanje odgovora modela s postojećim zapisnikom m
function sastavi(m, d, transkript) {
  const tk = Array.isArray(m.tacke) ? m.tacke : [];
  const dt = Array.isArray(d.tacke) ? d.tacke : [];
  const tacke = tk.map((t, i) => { const x = dt[i] || {};
    return { ...t, rasprava: str(x.rasprava), za: str(x.za, 50), protiv: str(x.protiv, 50), suzdrzani: str(x.suzdrzani, 50),
      nacin: NACINI.includes(x.nacin) ? x.nacin : (t.nacin || 'Bez glasanja'), zakljucak: str(x.zakljucak), izdvojeno: str(x.izdvojeno) }; });
  const oznaka = m.scope === 'ZAJEDNICKI' ? 'zajedničko' : m.scope;
  const zadaci = (Array.isArray(d.zadaci) ? d.zadaci : []).slice(0, 200)
    .map(z => ({ zadatak: str(z && z.zadatak, 2000), odgovorna: str(z && z.odgovorna, 300), rok: validDatum(str(z && z.rok, 10)), status: 'Otvoren', oznaka }))
    .filter(z => z.zadatak.trim());
  return { tacke, zadaci: zadaci.length ? zadaci : m.zadaci, naredni: str(d.naredni) || m.naredni || '', transkript };
}

}

      Object.keys(mem[id]||{}).forEach(n=>{ out[String(n).padStart(4,"0")] = out[String(n).padStart(4,"0")] || mem[id][n]; });
      return Object.keys(out).sort().map(k=>out[k]).filter(Boolean);

  };

function prijava(){
  $("#tabs").innerHTML=""; $("#who").textContent=""; $("#logout").classList.add("hide");
  $("#main").innerHTML = `
  <h2>Prijava</h2>
  ${DEMO? `<div class="note"><b>DEMO način.</b> Podaci ostaju samo u ovom pregledniku, a obrada snimka (prepoznavanje govora) nije povezana. Povezivanje s Firebase opisano je u uputama.${S.initGreska?" <br><b>Firebase se nije pokrenuo:</b> "+esc(S.initGreska):""}</div>`:""}
  ${S.bezUloge?`<div class="note">Vašem nalogu još nije dodijeljena uloga. Obratite se administratoru.</div>`:""}
  <div class="row" style="max-width:520px">
    <div><label>E-pošta</label><input id="em" type="email" autocomplete="username"></div>
    ${DEMO? `<div><label>Ime i prezime</label><input id="im"></div>`:`<div><label>Lozinka</label><input id="pw" type="password" autocomplete="current-password"></div>`}
  </div>
  <p id="perr" class="muted" style="color:#a32020"></p>
  <button id="go">Prijavi se</button>`;
  $("#go").onclick = async ()=>{
    const em=$("#em").value.trim();
    if(!em){ $("#perr").textContent="Unesite e-poštu."; return; }
    if(DEMO){
      const im=$("#im").value.trim(); if(!im){ $("#perr").textContent="Unesite ime i prezime."; return; }
      S.user={email:em,ime:im}; lsSet("zs_user",S.user); render();
    } else {
      try{
        const cr = await fb.auth.signInWithEmailAndPassword(em,$("#pw").value);
        const ima = await ucitajKorisnika(cr.user);
        if(!ima){ await fb.auth.signOut(); S.user=null; S.bezUloge=true; prijava(); return; }
        S.bezUloge=false; render();
      }catch(e){ $("#perr").textContent="Prijava nije uspjela: "+(/auth\/(invalid|wrong|user-not-found)/.test(e.code||"")?"pogrešna e-pošta ili lozinka.":e.message); }
    }
  };
}

/* ============ GLAVNI OKVIR ============ */
const TABOVI = [["novi","Novi sastanak"],["arhiva","Arhiva"],["upute","Upute"]];
async function render(){
  if(!S.user){ prijava(); return; }
  $("#who").textContent = S.user.ime||S.user.email;
  const lo=$("#logout"); lo.classList.remove("hide");
  lo.onclick = async ()=>{ if(!DEMO) await fb.auth.signOut(); S.user=null; S.mem=null; lsSet("zs_user",null); render(); };
  $("#tabs").innerHTML = TABOVI.map(([k,t])=>`<button class="${S.tab===k?"on":""}" data-k="${k}">${t}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ if(S.rec&&!confirm("Snimanje je u toku. Napustiti ekran?"))return; S.tab=b.dataset.k; S.cur=null; render(); });
  try{ S.meetings = await store.list(); }catch(e){ $("#main").innerHTML=`<div class="note">Greška pri čitanju: ${esc(e.message)}</div>`; return; }
  if(S.cur) return radni();
  if(S.tab==="novi") return noviEkran();
  if(S.tab==="arhiva") return arhiva();
  return upute();
}

/* ============ NOVI SASTANAK ============ */
function noviEkran(){
  $("#main").innerHTML = `
  <h2>Priprema sastanka</h2>
  <div class="row">
    <div><label>Ustanova</label><select id="n_sc">${Object.entries(USTANOVE).map(([k,v])=>`<option value="${k}">${k==="ZAJEDNICKI"?"Zajednički sastanak uprave (IMH + IDSS)":k}</option>`).join("")}</select></div>
    <div><label>Vrsta sastanka</label><select id="n_tip">${TIPOVI.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>
  </div>
  <label>Tema sastanka</label><input id="n_tema">
  <div class="row">
    <div><label>Mjesto</label><input id="n_mj"></div>
    <div><label>Datum</label><input id="n_dat" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label>Nivo povjerljivosti</label><select id="n_pov"><option>Opći</option><option>Povjerljiv</option><option>Strogo povjerljivo</option></select></div>
  </div>
  <div class="row">
    <div><label>Predsjedavajući</label><input id="n_pred"></div>
    <div><label>Zapisničar</label><input id="n_zap" value="${esc(S.user.ime||"")}"></div>
  </div>
  <label>Učesnici (jedan red = jedna osoba, format: Ime i prezime — funkcija)</label>
  <textarea id="n_uc" placeholder="Ime Prezime — direktor"></textarea>
  <label>Dnevni red (jedan red = jedna tačka; za zajednički sastanak dodajte oznaku na kraju reda: [IMH], [IDSS] ili [zajedničko])</label>
  <textarea id="n_dn" placeholder="Prva tačka\nDruga tačka"></textarea>
  <div class="actions"><button id="n_go">Nastavi na saglasnost i snimanje</button></div>`;
  $("#n_sc").onchange = e=>{ $("#n_tip").innerHTML = tipoviZa(e.target.value).map(t=>`<option>${esc(t)}</option>`).join(""); };
  $("#n_go").onclick = ()=>{
    const sc=$("#n_sc").value;
    const prisutni = $("#n_uc").value.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{const [i,...u]=r.split(/\s[—–-]\s/); return {ime:i.trim(),uloga:(u.join(" – ")||"").trim(),napomena:""};});
    const dnevni = $("#n_dn").value.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{
      const m=r.match(/\s*\[(IMH|IDSS|zajedničko)\]\s*$/i); return {naslov:r.replace(/\s*\[[^\]]+\]\s*$/,""), oznaka:m?m[1].replace(/^zajedničko$/i,"zajedničko"):(sc==="ZAJEDNICKI"?"zajedničko":sc)};
    });
    const m = prazanZapisnik({scope:sc,tip:$("#n_tip").value,tema:$("#n_tema").value.trim(),mjesto:$("#n_mj").value.trim(),datum:$("#n_dat").value,povjerljivost:$("#n_pov").value,predsjedavajuci:$("#n_pred").value.trim(),zapisnicar:$("#n_zap").value.trim(),
      prisutni:prisutni.length?prisutni:[{ime:"",uloga:"",napomena:""}], dnevni:dnevni.length?dnevni:[{naslov:"",oznaka:sc==="ZAJEDNICKI"?"zajedničko":sc}]});
    if(!m.tema){ alert("Unesite temu sastanka."); return; }
    m.tacke = m.dnevni.map(d=>({naslov:d.naslov,oznaka:d.oznaka,rasprava:"",za:"",protiv:"",suzdrzani:"",nacin:"Bez glasanja",zakljucak:"",izdvojeno:""}));
    m.status="saglasnost";
    store.save(m).then(()=>{ S.cur=m.id; render(); }).catch(e=>alert("Greška: "+e.message));
  };
}

/* ============ RADNI EKRAN (saglasnost → snimanje → obrada → pregled) ============ */
function cur(){ return S.meetings.find(m=>m.id===S.cur); }
function zaglavljeSastanka(m){
  return `<p><span class="badge b-${m.scope}">${m.scope==="ZAJEDNICKI"?"Zajednički":m.scope}</span> <span class="badge st-${m.status}">${statusTekst(m.status)}</span> &nbsp;<b>${esc(m.tema)}</b> <span class="muted">· ${esc(m.tip)} · ${fmtDat(m.datum)}</span></p>`;
}
function statusTekst(s){ return {saglasnost:"saglasnost",snimanje:"snimanje",obrada:"obrada",nacrt:"nacrt",potvrdjen:"potvrđen"}[s]||s; }
function radni(){
  const m=cur(); if(!m){ S.cur=null; return render(); }
  document.documentElement.style.setProperty("--acc", USTANOVE[m.scope==="ZAJEDNICKI"?"IDSS":m.scope].boja);
  if(m.status==="saglasnost") return ekranSaglasnost(m);
  if(m.status==="snimanje") return ekranSnimanje(m);
  if(m.status==="obrada") return ekranObrada(m);
  return ekranPregled(m);
}

function ekranSaglasnost(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`
  <h2>Saglasnost za snimanje</h2>
  <div class="note">Snimanje je dozvoljeno samo uz saglasnost <b>svih prisutnih</b>. Saglasnost se evidentira prije početka. Snimak se briše nakon potvrde zapisnika.</div>
  <label><input type="checkbox" id="s_da" style="width:auto"> Svi prisutni su obaviješteni o snimanju i saglasni su.</label>
  <label>Ko je saglasnost evidentirao (ime i prezime)</label><input id="s_ko" value="${esc(S.user.ime||"")}">
  <div class="actions">
    <button id="s_sn" disabled>Nastavi na snimanje</button>
    <button id="s_bez" class="sec">Nastavi bez snimanja (ručni unos)</button>
  </div>`;
  const prov=()=>{ $("#s_sn").disabled = !($("#s_da").checked && $("#s_ko").value.trim()); };
  $("#s_da").onchange=prov; $("#s_ko").oninput=prov;
  $("#s_sn").onclick=async()=>{
    m.saglasnost={data:true,dao:$("#s_ko").value.trim(),kada:new Date().toISOString(),tekst:"Svi prisutni obaviješteni i saglasni sa snimanjem."};
    m.snimano=true; m.status="snimanje";
    try{ await store.consent(m); await store.save(m);}catch(e){ alert("Greška: "+e.message); return; }
    render();
  };
  $("#s_bez").onclick=async()=>{ m.snimano=false; m.status="nacrt"; await store.save(m); render(); };
}

function fmtT(s){ const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60; return [h,mm,ss].map(x=>String(x).padStart(2,"0")).join(":"); }
function ekranSnimanje(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`
  <h2>Snimanje</h2>
  <div class="note">Ne zaključavajte ekran i ne prelazite u drugu aplikaciju dok traje snimanje. Za duge sastanke koristite laptop s mikrofonom na stolu.</div>
  <div class="rec"><span id="r_dot" class="dot hide"></span><span class="time" id="r_t">00:00:00</span>
    <button id="r_start">Počni snimanje</button><button id="r_stop" class="dng hide">Završi snimanje</button></div>
  <p id="r_msg" class="muted"></p>
  <h3>Ili učitajte gotov audio zapis</h3>
  <input type="file" id="r_file" accept="audio/*">
  <div id="r_prev"></div>
  <h3>Ili zalijepite transkript (za probu bez prepoznavanja govora)</h3>
  <textarea id="r_tr" placeholder="Tekst razgovora…">${esc(m.transkript||"")}</textarea>
  <div class="actions"><button id="r_next" class="sec">Nastavi na obradu</button></div>`;
  let chunks=[], segNo=0, t0=0, tick=null, rot=null, mr=null, stream=null, wl=null, failed=0, uploaded=false, rotira=false, mt=null;
  const SEG_MS = 20*60*1000;     // snimak se dijeli na samostalne dijelove od po 20 minuta (svaki ostaje ispod ograničenja Geminija)
  const msg=t=>$("#r_msg").textContent=t;
  async function prikaziDijelove(trajanje){
    const dij = await aud.all(m.id);
    $("#r_prev").innerHTML = (trajanje!=null?`<p>Snimak završen (${fmtT(trajanje)}). Čuva se samo na ovom računaru.</p>`:"") +
      dij.map((b,i)=>{ const u=URL.createObjectURL(b); return `<p>Dio ${i+1} (${Math.round(b.size/1024)} KB)<br><audio controls src="${u}"></audio><br><a download="snimak-${m.id}-dio${i+1}.${extZa(b)}" href="${u}">Preuzmi dio ${i+1}</a></p>`; }).join("");
  }
  function pokreniDio(){
    chunks=[]; const my=++segNo;
    mr = new MediaRecorder(stream, Object.assign(mt?{mimeType:mt}:{}, {audioBitsPerSecond:32000}));
    mr.ondataavailable = ev=>{
      if(!ev.data.size) return; chunks.push(ev.data);
      aud.put(m.id, my, new Blob(chunks,{type:mr.mimeType||"audio/webm"})).then(ok=>{ if(!ok){ failed++; msg("Upozorenje: snimak se ne može sačuvati na disk preglednika; ostaje samo u memoriji. Ne zatvarajte stranicu."); } });
    };
    mr.onstop = ()=>{
      if(rotira){ rotira=false; try{ pokreniDio(); }catch(e){ msg("Snimanje se prekinulo: "+e.message); zavrsi(); } return; }
      zavrsi();
    };
    mr.start(30000); S.rec=mr;
  }
  function zavrsi(){
    stream.getTracks().forEach(t=>t.stop()); clearInterval(tick); clearInterval(rot); if(wl){try{wl.release();}catch(e){}}
    S.rec=null; $("#r_dot").classList.add("hide"); $("#r_stop").classList.add("hide"); $("#r_start").classList.add("hide");
    setTimeout(()=>prikaziDijelove(Math.round((Date.now()-t0)/1000)), 400);
    m.fazaSnimka="snimljeno"; m.kraj = m.kraj || new Date().toTimeString().slice(0,5); store.save(m);
  }
  $("#r_start").onclick=async()=>{
    if(uploaded){ msg("Već ste učitali audio zapis. Snimanje i učitavanje ne miješajte u istom sastanku."); return; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ msg("Mikrofon nije dostupan: "+e.message+". Možete učitati gotov audio zapis."); return; }
    mt = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
    try{ if(navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); }catch(e){}
    try{ pokreniDio(); }catch(e){ msg("Snimanje nije moguće: "+e.message); stream.getTracks().forEach(t=>t.stop()); return; }
    t0=Date.now(); m.pocetak = m.pocetak || new Date().toTimeString().slice(0,5);
    $("#r_dot").classList.remove("hide"); $("#r_stop").classList.remove("hide"); $("#r_start").classList.add("hide");
    tick=setInterval(()=>$("#r_t").textContent=fmtT(Math.round((Date.now()-t0)/1000)),500);
    rot=setInterval(()=>{ if(mr && mr.state==="recording"){ rotira=true; try{ mr.stop(); }catch(e){ rotira=false; } } }, SEG_MS);
    msg("Snimanje je u toku. Snimak se čuva na ovom računaru (ne šalje se na server) i dijeli na dijelove od 20 minuta.");
  };
  $("#r_stop").onclick=()=>{ rotira=false; try{ mr.stop(); }catch(e){} };
  $("#r_file").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(S.rec || segNo){ msg("Već ste snimali u ovom sastanku. Audio zapis učitajte u novom sastanku."); e.target.value=""; return; }
    if(uploaded){ msg("Audio zapis je već učitan. Za drugi zapis napravite novi sastanak."); e.target.value=""; return; }
    if(f.size > 14*1024*1024){ msg("Zapis je prevelik ("+Math.round(f.size/1048576)+" MB; najviše 14 MB, oko jedan sat). Podijelite ga na kraće dijelove."); e.target.value=""; return; }
    if(!(await aud.put(m.id,1,f))){ msg("Zapis se ne može sačuvati na disk preglednika; ostaje u memoriji dok ne zatvorite stranicu."); }
    uploaded=true; m.fazaSnimka="otpremljeno"; await store.save(m); await prikaziDijelove(null); msg("Zapis je učitan (ostaje na ovom računaru).");
  };
  prikaziDijelove(null);
  $("#r_next").onclick=async()=>{
    if(S.rec){ alert("Prvo završite snimanje."); return; }
    if(failed && !confirm("Snimak se nije mogao sačuvati na disk preglednika. Ako se stranica zatvori, snimak je izgubljen. Nastaviti svejedno?")) return;
    $("#r_next").disabled=true;
    m.transkript=$("#r_tr").value; m.status="obrada";
    try{ await store.save(m); }catch(e){ alert("Greška: "+e.message); $("#r_next").disabled=false; return; }
    render();
  };
}

function nacrtIzTranskripta(m){
  // DEMO: bez prepoznavanja govora i bez jezičkog modela; ništa se ne izmišlja.
  m.tacke.forEach(t=>{ if(!t.rasprava) t.rasprava = m.transkript? "[nejasno – transkript je priložen, tačka nije razvrstana]":""; });
  return m;
}
function ekranObrada(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`<h2>Obrada snimka</h2><p class="muted">Sadržaj sastanka se šalje Googleu (besplatni Gemini) – odluka Direktora.</p><p id="ob" class="muted">Obrada je u toku…</p><div class="actions"><button id="ob_skip" class="sec hide">Nastavi s ručnim unosom</button></div>`;
  S.obrada = S.obrada || {};
  if(S.obrada[m.id]) return;
  S.obrada[m.id] = true;
  (async()=>{
    try{
      if(DEMO){
        await new Promise(r=>setTimeout(r,600));
        nacrtIzTranskripta(m);
        $("#ob").innerHTML = `<b>Demo:</b> prepoznavanje govora nije povezano. Napravljen je prazan nacrt iz dnevnog reda${m.transkript?" uz priloženi transkript":""}.`;
      } else {
        const r = await store.process(m, (i,n)=>{ const el=$("#ob"); if(el) el.textContent="Prepoznavanje govora: dio "+i+" od "+n+"…"; });
        if(r && r.minutes) Object.assign(m, r.minutes, {id:m.id,scope:m.scope});
        $("#ob").textContent="Obrada završena. Nacrt je spreman za pregled.";
      }
      m.status="nacrt"; await store.save(m);
      delete S.obrada[m.id];
      setTimeout(render,900);
    }catch(e){
      delete S.obrada[m.id];
      const el=$("#ob"); if(el){ el.innerHTML=`Obrada nije uspjela: ${esc(e.message)}`; $("#ob_skip").classList.remove("hide");
      $("#ob_skip").onclick=async()=>{ try{ m.status="nacrt"; await store.save(m); render(); }catch(e2){ alert("Greška: "+e2.message); } }; }
    }
  })();
}

/* ============ PREGLED I ISPRAVKA NACRTA ============ */
function ekranPregled(m){
  const lock = m.status==="potvrdjen"; const d = lock?"disabled":"";
  const jz = m.scope==="ZAJEDNICKI";
  const ozn = (v,i,k)=> jz? `<td><select ${d} data-l="${k}.${i}.oznaka">${OZNAKE.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></td>`:"";
  const inp = (path,val,ph="",tip="text")=>`<input ${d} type="${tip}" data-p="${path}" value="${esc(val)}" placeholder="${esc(ph)}">`;
  $("#main").innerHTML = zaglavljeSastanka(m)+`
  <h2>${lock?"Potvrđeni zapisnik":"Pregled i ispravka nacrta"}</h2>
  ${lock?`<div class="note ok">Zapisnik je potvrđen (${esc(m.potvrdio)}, ${fmtDat(m.potvrdjenoKada)}) i zaključan.</div>`:`<div class="note">Nacrt nije službeni zapisnik dok ga ovlaštena osoba ne potvrdi. Nejasna mjesta označite kao <b>[nejasno]</b>. Rok i odgovornu osobu upisujte samo ako su izričito dogovoreni.</div>`}
  <h3>1. Osnovni podaci</h3>
  <div class="row">
    <div><label>Broj zapisnika</label>${inp("broj",m.broj,"npr. 01/2026")}</div>
    <div><label>Vrsta sastanka</label><select ${d} data-p="tip">${tipoviZa(m.scope).map(t=>`<option ${t===m.tip?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
    <div><label>Tema</label>${inp("tema",m.tema)}</div>
    <div><label>Mjesto</label>${inp("mjesto",m.mjesto)}</div>
    <div><label>Datum</label>${inp("datum",m.datum,"","date")}</div>
    <div><label>Početak</label>${inp("pocetak",m.pocetak,"","time")}</div>
    <div><label>Završetak</label>${inp("kraj",m.kraj,"","time")}</div>
    <div><label>Povjerljivost</label><select ${d} data-p="povjerljivost">${["Opći","Povjerljiv","Strogo povjerljivo"].map(t=>`<option ${t===m.povjerljivost?"selected":""}>${t}</option>`).join("")}</select></div>
  </div>
  <p class="muted">Snimanje: ${m.snimano?`da, uz saglasnost (evidentirao/la ${esc(m.saglasnost.dao)}, ${m.saglasnost.kada?new Date(m.saglasnost.kada).toLocaleString("bs-Latn-BA"):""})`:"ne"}</p>
  <h3>2. Prisutni</h3>
  <table><tr><th>R.br.</th><th>Ime i prezime</th><th>Funkcija / uloga</th><th>Napomena</th></tr>
  ${m.prisutni.map((p,i)=>`<tr><td>${i+1}</td><td>${inp(`prisutni.${i}.ime`,p.ime)}</td><td>${inp(`prisutni.${i}.uloga`,p.uloga)}</td><td>${inp(`prisutni.${i}.napomena`,p.napomena)}</td></tr>`).join("")}</table>
  ${lock?"":`<button class="sec" data-add="prisutni">+ osoba</button>`}
  <div class="row"><div><label>Opravdano odsutni</label>${inp("odsutniOp",m.odsutniOp)}</div><div><label>Neopravdano odsutni</label>${inp("odsutniNeop",m.odsutniNeop)}</div><div><label>Učesnici bez prava glasa</label>${inp("bezGlasa",m.bezGlasa)}</div></div>
  <div class="row"><div><label>Kvorum</label><select ${d} data-p="kvorum">${["Ostvaren","Nije ostvaren","Nije potreban"].map(t=>`<option ${t===m.kvorum?"selected":""}>${t}</option>`).join("")}</select></div><div><label>Predsjedavajući</label>${inp("predsjedavajuci",m.predsjedavajuci)}</div><div><label>Zapisničar</label>${inp("zapisnicar",m.zapisnicar)}</div></div>
  <h3>3. Tok sastanka po tačkama</h3>
  ${m.tacke.map((t,i)=>`<div class="card"><b>Ad ${i+1}.</b>
    <div class="row"><div><label>Naziv tačke</label>${inp(`tacke.${i}.naslov`,t.naslov)}</div>${jz?`<div><label>Ustanova</label><select ${d} data-p="tacke.${i}.oznaka">${OZNAKE.map(o=>`<option ${o===t.oznaka?"selected":""}>${o}</option>`).join("")}</select></div>`:""}</div>
    <label>Rasprava</label><textarea ${d} data-p="tacke.${i}.rasprava">${esc(t.rasprava)}</textarea>
    <div class="row"><div><label>Za</label>${inp(`tacke.${i}.za`,t.za)}</div><div><label>Protiv</label>${inp(`tacke.${i}.protiv`,t.protiv)}</div><div><label>Suzdržani</label>${inp(`tacke.${i}.suzdrzani`,t.suzdrzani)}</div>
    <div><label>Način</label><select ${d} data-p="tacke.${i}.nacin">${["Javno","Tajno","Bez glasanja"].map(o=>`<option ${o===t.nacin?"selected":""}>${o}</option>`).join("")}</select></div></div>
    <label>Zaključak</label><textarea ${d} data-p="tacke.${i}.zakljucak" style="min-height:60px">${esc(t.zakljucak)}</textarea>
    <label>Izdvojeno mišljenje</label>${inp(`tacke.${i}.izdvojeno`,t.izdvojeno)}</div>`).join("")}
  ${lock?"":`<button class="sec" data-add="tacke">+ tačka</button>`}
  <h3>4. Zadaci i dogovori</h3>
  <table><tr><th>R.br.</th><th>Zadatak / dogovor</th><th>Odgovorna osoba</th><th>Krajnji rok</th><th>Status</th>${jz?"<th>Ustanova</th>":""}</tr>
  ${m.zadaci.map((z,i)=>`<tr><td>${i+1}</td><td>${inp(`zadaci.${i}.zadatak`,z.zadatak)}</td><td>${inp(`zadaci.${i}.odgovorna`,z.odgovorna)}</td><td>${inp(`zadaci.${i}.rok`,z.rok,"","date")}</td>
   <td><select ${d} data-p="zadaci.${i}.status">${["Otvoren","U toku","Završen"].map(o=>`<option ${o===z.status?"selected":""}>${o}</option>`).join("")}</select></td>${jz?`<td><select ${d} data-p="zadaci.${i}.oznaka">${OZNAKE.map(o=>`<option ${o===z.oznaka?"selected":""}>${o}</option>`).join("")}</select></td>`:""}</tr>`).join("")}</table>
  ${lock?"":`<button class="sec" data-add="zadaci">+ zadatak</button>`}
  <div class="row"><div><label>Prilozi</label>${inp("prilozi",m.prilozi)}</div><div><label>Naredni sastanak</label>${inp("naredni",m.naredni)}</div></div>

  <div class="actions">
    ${lock?"":`<button id="p_save" class="sec">Sačuvaj nacrt</button><button id="p_ok">Potvrdi zapisnik</button>`}
    <button id="p_docx" class="sec">Preuzmi DOCX (uredivo)</button>
    ${lock&&m.snimano?`<button id="p_purge" class="sec">Obriši snimak s ovog računara</button>`:""}
    <button id="p_print" class="sec">Ispis / PDF</button>
    ${jz&&lock?`<button class="sec" id="p_ix1">Izvod za IMH (PDF)</button><button class="sec" id="p_ix2">Izvod za IDSS (PDF)</button><button class="sec" id="p_dx1">Izvod za IMH (DOCX)</button><button class="sec" id="p_dx2">Izvod za IDSS (DOCX)</button>`:""}
    <button id="p_back" class="sec">Nazad na arhivu</button>
  </div>`;
  const setPath=(o,p,v)=>{ const k=p.split("."); let c=o; for(let i=0;i<k.length-1;i++) c=c[k[i]]; c[k[k.length-1]]=v; };
  const sakupi=()=>{ document.querySelectorAll("#main [data-p]").forEach(e=>setPath(m,e.dataset.p,e.value)); };
  document.querySelectorAll("#main [data-add]").forEach(b=>b.onclick=()=>{
    sakupi(); const def = jz?"zajedničko":m.scope;
    if(b.dataset.add==="prisutni") m.prisutni.push({ime:"",uloga:"",napomena:""});
    if(b.dataset.add==="tacke") m.tacke.push({naslov:"",oznaka:def,rasprava:"",za:"",protiv:"",suzdrzani:"",nacin:"Bez glasanja",zakljucak:"",izdvojeno:""});
    if(b.dataset.add==="zadaci") m.zadaci.push({zadatak:"",odgovorna:"",rok:"",status:"Otvoren",oznaka:def});
    ekranPregled(m);
  });
  if(!lock){
    $("#p_save").onclick=async()=>{ sakupi(); await store.save(m); alert("Nacrt je sačuvan."); };
    $("#p_ok").onclick=async()=>{
      sakupi();
      const problemi=[];
      m.zadaci.filter(z=>z.zadatak.trim()).forEach((z,i)=>{ if(!z.odgovorna.trim()) problemi.push(`Zadatak ${i+1}: nema odgovorne osobe`); if(!z.rok) problemi.push(`Zadatak ${i+1}: nema krajnjeg roka`); });
      if(!m.predsjedavajuci.trim()) problemi.push("Nije upisan predsjedavajući");
      if(!m.zapisnicar.trim()) problemi.push("Nije upisan zapisničar");
      if(JSON.stringify(m).includes("[nejasno")) problemi.push("U zapisniku su još označena mjesta [nejasno]");
      if(problemi.length && !confirm("Prije potvrde provjerite:\n\n- "+problemi.join("\n- ")+"\n\nPotvrditi svejedno?")) return;
      if(!confirm("Potvrditi zapisnik? Nakon potvrde se više ne može mijenjati.")) return;
      m.status="potvrdjen"; m.potvrdio=S.user.ime||S.user.email; m.potvrdjenoKada=new Date().toISOString();
      try{ await store.save(m); }catch(e){ m.status="nacrt"; m.potvrdio=""; m.potvrdjenoKada=""; alert("Potvrda nije uspjela: "+e.message); return; }
      if(m.snimano){ try{ await store.purge(m); }catch(e){ alert("Zapisnik je potvrđen, ali snimak nije obrisan: "+e.message+"\nObrišite ga dugmetom „Obriši snimak“ u potvrđenom zapisniku."); } }
      render();
    };
  }
  const dx = izv => async()=>{ sakupi(); if(!lock) await store.save(m);
    try{ const blob = await DX.izvezi(m, izv, USTANOVE, TPL, KOD_OBRASCA, IZDANJE); preuzmi(blob, nazivFajla(m, izv)); }catch(e){ alert("DOCX izvoz nije uspio: "+e.message); } };
  $("#p_docx").onclick=dx(null);
  if($("#p_purge")) $("#p_purge").onclick=async()=>{ try{ const r=await store.purge(m); alert("Snimak je obrisan"+(r&&r.obrisano!=null?" ("+r.obrisano+" fajl.)":"")+"."); }catch(e){ alert("Brisanje nije uspjelo: "+e.message); } };
  $("#p_print").onclick=()=>ispis(m);
  if(jz&&lock){ $("#p_ix1").onclick=()=>ispis(m,"IMH"); $("#p_ix2").onclick=()=>ispis(m,"IDSS"); $("#p_dx1").onclick=dx("IMH"); $("#p_dx2").onclick=dx("IDSS"); }
  $("#p_back").onclick=()=>{ S.cur=null; S.tab="arhiva"; render(); };
}

/* ============ DOCX IZVOZ (uređivi Word dokument na memorandumu ustanove) ============ */
const DX = (() => {
  const FONT = "Century Gothic", LANG = "bs-Latn-BA";
  const CFGS = {
    IDSS: {W: 10335, A: "035EA1", L: "08ABE6", ind: '<w:ind w:right="1800"/>'},
    IMH:  {W: 9360,  A: "9F633F", L: "2CB14D", ind: '<w:ind w:left="-709" w:right="-705"/>'}
  };
  // Uklanja znakove koji nisu dozvoljeni u XML 1.0 (inače Word odbije otvoriti dokument), uključujući neparne surrogate.
  const CIST = s => {
    s = String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, "");
    let o = "";
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDBFF) { const n = s.charCodeAt(i + 1); if (n >= 0xDC00 && n <= 0xDFFF) { o += s[i] + s[i + 1]; i++; } else o += "\uFFFD"; }
      else if (c >= 0xDC00 && c <= 0xDFFF) o += "\uFFFD";
      else o += s[i];
    }
    return o;
  };
  const X = s => CIST(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\t/g, " ");
  const rpr = ({sz = 18, b = false, color = null, i = false} = {}) =>
    `<w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}"/>${b ? "<w:b/>" : ""}${i ? "<w:i/>" : ""}${color ? `<w:color w:val="${color}"/>` : ""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:lang w:val="${LANG}"/></w:rPr>`;
  const run = (t, o = {}) => `<w:r>${rpr(o)}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  const para = (content = "", o = {}) => {
    const {jc = "left", before = 0, after = 0, sz = 18, keep = false, ind = 0} = o;
    return `<w:p><w:pPr>${keep ? "<w:keepNext/>" : ""}<w:spacing w:before="${before}" w:after="${after}" w:line="252" w:lineRule="auto"/>${ind ? `<w:ind w:left="${ind}"/>` : ""}<w:jc w:val="${jc}"/>${rpr({sz})}</w:pPr>${content}</w:p>`;
  };
  const text = (t, o = {}) => CIST(t).split(/\r\n|\r|\n/).map(l => para(l ? run(l, o) : "", {sz: o.sz, keep: o.keep})).join("");
  const tc = (w, content, o = {}) => {
    const {fill = null, span = 1, valign = "center"} = o;
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ""}${fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>` : ""}<w:tcMar><w:top w:w="50" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="50" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tcMar><w:vAlign w:val="${valign}"/></w:tcPr>${content}</w:tc>`;
  };
  const table = (cols, rows, line, heights = []) => {
    const total = cols.reduce((a, b) => a + b, 0);
    const bd = ["top", "left", "bottom", "right", "insideH", "insideV"].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="${line}"/>`).join("");
    let out = `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${cols.map(c => `<w:gridCol w:w="${c}"/>`).join("")}</w:tblGrid>`;
    rows.forEach((r, ri) => {
      if (ri < rows.length - 1) r = r.replace(/<w:keepNext\/>/g, "").replace(/<w:pPr>/g, "<w:pPr><w:keepNext/>");
      const h = heights[ri];
      out += `<w:tr><w:trPr><w:cantSplit/>${h ? `<w:trHeight w:val="${h}" w:hRule="atLeast"/>` : ""}</w:trPr>${r}</w:tr>`;
    });
    return out + "</w:tbl>";
  };
  const spaced = s => s.split(" ").map(w => w.split("").join(" ")).join("   ");
  const fmtD = iso => { if (!iso) return ""; const p = String(iso).slice(0, 10).split("-"); return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}.` : String(iso); };
  const cb = (on, t) => (on ? "☒ " : "☐ ") + t;

  function body(m, c, o) {
    const {W, A, L} = c, joint = o.joint, izvod = o.izvod;
    const ok = x => !izvod || x === "zajedničko" || x === izvod;
    const out = [];
    const section = t => out.push(para(run(t, {sz: 20, b: true, color: A}), {before: 200, after: 70, keep: true}));
    const hrow = (cols, labels) => cols.map((w, i) => tc(w, para(run(labels[i], {sz: 16, b: true, color: "FFFFFF"})), {fill: A})).join("");
    const lab = (w, t) => tc(w, para(run(t, {sz: 16, b: true, color: A})));
    const val = (w, t = "", span = 1) => tc(w, text(t, {sz: 18}), {span});
    const note = (t, o2 = {}) => out.push(para(run(t, {sz: 14, i: true}), o2));
    const gap = n => out.push(para("", {sz: 2}).replace('w:line="252"', `w:line="${n}"`));

    out.push(para(run(`Broj zapisnika: ${m.broj || "____"}        Sarajevo, ${fmtD(m.datum) || "______________"}`, {sz: 18}), {after: 140}));
    out.push(para(run(spaced(joint ? "ZAPISNIK SA ZAJEDNIČKOG SASTANKA UPRAVE" : "ZAPISNIK SA SASTANKA") + (izvod ? "  —  IZVOD ZA " + izvod : ""), {sz: joint ? 26 : 30, b: true, color: A}), {jc: "center", after: 40}));
    o.names.forEach(n => out.push(para(run(n, {sz: 15, i: true}), {jc: "center", after: 20})));
    out.push(para("", {after: 120, sz: 4}));

    // 1. Vrsta
    section("1. Vrsta sastanka");
    const tipovi = joint
      ? [["Redovni sastanak uprave", "Vanredni sastanak uprave"], ["Strateški / planski sastanak", "Drugo"]]
      : [["Razgovor sa zaposlenim", "Individualni roditeljski sastanak"], ["Grupni (razredni) roditeljski sastanak", "Sastanak sa partnerom"], ["Radni sastanak tima / stručnog organa", "Drugo"]];
    const known = tipovi.flat();
    const half = Math.floor(W / 2);
    out.push(table([half, W - half], tipovi.map(pair => pair.map(t => {
      const on = m.tip === t || (t === "Drugo" && !known.includes(m.tip));
      return tc(half, para(run(cb(on, t) + (t === "Drugo" ? (on && m.tip !== "Drugo" ? ": " + m.tip : ": ______________________") : ""), {sz: 18})));
    }).join("")), L));

    // 2. Osnovni podaci
    section("2. Osnovni podaci");
    const c4 = [Math.floor(W * .2), Math.floor(W * .3), Math.floor(W * .2)]; c4.push(W - c4[0] - c4[1] - c4[2]);
    const rest3 = c4[1] + c4[2] + c4[3];
    out.push(table(c4, [
      lab(c4[0], "Tema sastanka") + val(rest3, m.tema, 3),
      lab(c4[0], "Mjesto održavanja") + val(c4[1], m.mjesto) + lab(c4[2], "Datum") + val(c4[3], fmtD(m.datum)),
      lab(c4[0], "Vrijeme početka") + val(c4[1], m.pocetak) + lab(c4[2], "Vrijeme završetka") + val(c4[3], m.kraj),
      lab(c4[0], "Nivo povjerljivosti") + tc(rest3, para(run(["Opći", "Povjerljiv", "Strogo povjerljivo"].map(x => cb(m.povjerljivost === x, x)).join("      "), {sz: 18})), {span: 3}),
      lab(c4[0], "Snimanje sastanka") + tc(rest3, para(run(cb(!m.snimano, "Ne") + "      " + cb(!!m.snimano, "Da, uz saglasnost svih prisutnih (evidentirano prije početka)"), {sz: 18})), {span: 3})
    ], L));

    // 3. Prisutni
    section("3. Prisutni, odsutni i učesnici bez prava glasa");
    const pc = [600, Math.floor(W * .38), Math.floor(W * .27)]; pc.push(W - pc[0] - pc[1] - pc[2]);
    const pris = m.prisutni.filter(p => p.ime || p.uloga || p.napomena);
    const nP = Math.max(5, pris.length);
    const prow = [hrow(pc, ["R.br.", "Ime i prezime", "Funkcija / uloga", "Napomena (kasniji dolazak, raniji odlazak, vrijeme)"])];
    for (let i = 0; i < nP; i++) { const p = pris[i] || {}; prow.push(tc(pc[0], para(run(String(i + 1), {sz: 16}), {jc: "center"})) + val(pc[1], p.ime) + val(pc[2], p.uloga) + val(pc[3], p.napomena)); }
    out.push(table(pc, prow, L, [null, ...Array(nP).fill(330)]));
    gap(60);
    const c2 = [Math.floor(W / 2), W - Math.floor(W / 2)];
    const lblcell = (w, l, v, span = 1) => tc(w, para(run(l, {sz: 16, b: true, color: A})) + text(v, {sz: 18}), {span});
    out.push(table(c2, [
      lblcell(c2[0], "Opravdano odsutni (ime i prezime):", m.odsutniOp) + lblcell(c2[1], "Neopravdano odsutni (ime i prezime):", m.odsutniNeop),
      lblcell(W, "Učesnici bez prava glasa (ime i prezime, funkcija):", m.bezGlasa, 2)
    ], L, [620, 520]));

    // 4. Kvorum
    section("4. Kvorum, predsjedavajući i zapisničar");
    const k = [Math.floor(W * .22), Math.floor(W * .28), Math.floor(W * .22)]; k.push(W - k[0] - k[1] - k[2]);
    out.push(table(k, [
      lab(k[0], "Kvorum") + tc(k[1] + k[2] + k[3], para(run(["Ostvaren", "Nije ostvaren", "Nije potreban"].map(x => cb(m.kvorum === x, x)).join("      "), {sz: 16})), {span: 3}),
      lab(k[0], "Predsjedavajući") + val(k[1], m.predsjedavajuci) + lab(k[2], "Zapisničar") + val(k[3], m.zapisnicar)
    ], L));

    // 5. Dnevni red
    const tacke = m.tacke.filter(t => ok(t.oznaka));
    section("5. Dnevni red");
    const dc = joint ? [850, W - 850 - 1900 - 1800, 1800, 1900] : [850, W - 850 - 1900, 1900];
    const dlab = joint ? ["Tačka", "Predmet", "Ustanova (IMH / IDSS / zajedničko)", "Prijedlog usvojen? (za / protiv / suzdržani)"] : ["Tačka", "Predmet", "Prijedlog usvojen? (za / protiv / suzdržani)"];
    const nD = Math.max(4, tacke.length);
    const drow = [hrow(dc, dlab)];
    for (let i = 0; i < nD; i++) {
      const t = tacke[i];
      const glas = t && (t.za || t.protiv || t.suzdrzani) ? `${t.za || "-"} / ${t.protiv || "-"} / ${t.suzdrzani || "-"}` : "";
      drow.push(tc(dc[0], para(run(`${i + 1}.`, {sz: 16}), {jc: "center"})) + val(dc[1], t ? t.naslov : "") + (joint ? val(dc[2], t ? t.oznaka : "") : "") + val(dc[dc.length - 1], glas));
    }
    out.push(table(dc, drow, L, [null, ...Array(nD).fill(330)]));
    note("Predsjedavajući predlaže dnevni red i daje ga na usvajanje; prisutni ga glasanjem usvajaju i mogu ga dopuniti.", {before: 40});

    // 6. Tok
    section("6. Tok sastanka po tačkama dnevnog reda");
    out.push(para(run("Za svaku tačku: ime osobe koja je učestvovala u raspravi i sažet prikaz njenog izlaganja. Ništa se ne bilježi što nije izrečeno.", {sz: 14, i: true}), {after: 60, keep: true}));
    const tk = [Math.floor(W * .22), W - Math.floor(W * .22)];
    const nT = Math.max(1, tacke.length);
    for (let n = 0; n < nT; n++) {
      const t = tacke[n] || {naslov: "", oznaka: "", rasprava: "", nacin: "", za: "", protiv: "", suzdrzani: "", zakljucak: "", izdvojeno: ""};
      const ozn = joint ? "   " + ["IMH", "IDSS", "zajedničko"].map(x => cb(t.oznaka === x, x)).join("  ") : "";
      out.push(table(tk, [
        tc(W, para(run(`Ad ${n + 1}.  ${t.naslov || "____________________________________________"}${ozn}`, {sz: 18, b: true, color: "FFFFFF"}), {keep: true}), {fill: A, span: 2}),
        tc(tk[0], para(run("Rasprava", {sz: 16, b: true, color: A}), {keep: true}), {valign: "top"}) + tc(tk[1], text(t.rasprava, {sz: 18, keep: true})),
        lab(tk[0], "Rezultat glasanja") + tc(tk[1], para(run(`Za: ${t.za || "____"}     Protiv: ${t.protiv || "____"}     Suzdržani: ${t.suzdrzani || "____"}     ` + ["Javno", "Tajno", "Bez glasanja"].map(x => cb(t.nacin === x, x)).join("   "), {sz: 16}))),
        tc(tk[0], para(run("Zaključak", {sz: 16, b: true, color: A})), {valign: "top"}) + tc(tk[1], text(t.zakljucak, {sz: 18})),
        tc(tk[0], para(run("Izdvojeno mišljenje", {sz: 16, b: true, color: A})), {valign: "top"}) + tc(tk[1], text(t.izdvojeno, {sz: 18}))
      ], L, [null, 900, null, 520, 380]));
      gap(120);
    }

    // 7. Zadaci
    const zad = m.zadaci.filter(z => z.zadatak && ok(z.oznaka));
    section("7. Zadaci i dogovori");
    const zc = [600, Math.floor(W * (joint ? .38 : .42)), Math.floor(W * .2), 1500];
    zc.push(W - zc.reduce((a, b) => a + b, 0) - (joint ? 1400 : 0)); if (joint) zc.push(1400);
    const nZ = Math.max(5, zad.length);
    const zrow = [hrow(zc, ["R.br.", "Zadatak / dogovor", "Odgovorna osoba", "Krajnji rok", "Status", ...(joint ? ["Ustanova"] : [])])];
    for (let i = 0; i < nZ; i++) {
      const z = zad[i] || {};
      zrow.push(tc(zc[0], para(run(String(i + 1), {sz: 16}), {jc: "center"})) + val(zc[1], z.zadatak) + val(zc[2], z.odgovorna) + val(zc[3], fmtD(z.rok)) + val(zc[4], z.zadatak ? z.status : "") + (joint ? val(zc[5], z.oznaka) : ""));
    }
    out.push(table(zc, zrow, L, [null, ...Array(nZ).fill(330)]));
    note("Svaki zadatak mora imati odgovornu osobu i krajnji rok (QP 01).", {before: 40});

    // 8. Prilozi
    section("8. Prilozi i naredni sastanak");
    out.push(table([c4[0], W - c4[0]], [lab(c4[0], "Prilozi uz zapisnik") + val(W - c4[0], m.prilozi), lab(c4[0], "Naredni sastanak") + val(W - c4[0], m.naredni)], L));

    // 9. Ovjera
    section("9. Ovjera zapisnika");
    const oc = [Math.floor(W * .22), Math.floor(W * .28), Math.floor(W * .22)]; oc.push(W - oc[0] - oc[1] - oc[2]);
    const potv = m.status === "potvrdjen";
    out.push(table(oc, [
      lab(oc[0], "Vrijeme završetka") + val(oc[1], m.kraj) + lab(oc[2], "Status") + tc(oc[3], para(run(cb(!potv, "Nacrt") + "      " + cb(potv, "Potvrđen"), {sz: 18}))),
      lab(oc[0], "Zapisničar (potpis)") + val(oc[1], "") + lab(oc[2], "Predsjedavajući (potpis)") + val(oc[3], ""),
      lab(oc[0], "Datum potvrde") + val(oc[1], potv ? fmtD(m.potvrdjenoKada) : "") + lab(oc[2], "Potvrdio (ime i prezime)") + val(oc[3], potv ? m.potvrdio : "")
    ], L, [null, 780, null]));
    return out.join("");
  }

  function footerCtrl(c, code, form, edition) {
    const r = (t, o = {}) => run(t, {sz: 15, ...o});
    const fld = ins => `<w:r>${rpr({sz: 15})}<w:fldChar w:fldCharType="begin"/></w:r><w:r>${rpr({sz: 15})}<w:instrText xml:space="preserve"> ${ins} </w:instrText></w:r><w:r>${rpr({sz: 15})}<w:fldChar w:fldCharType="separate"/></w:r><w:r>${rpr({sz: 15})}<w:t>1</w:t></w:r><w:r>${rpr({sz: 15})}<w:fldChar w:fldCharType="end"/></w:r>`;
    return `<w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="6" w:space="4" w:color="${c.A}"/></w:pBdr><w:spacing w:before="0" w:after="40" w:line="240" w:lineRule="auto"/>${c.ind}${rpr({sz: 15})}</w:pPr>`
      + r(code, {b: true, color: c.A}) + r(`   |   ${form}   |   Izdanje ${edition}   |   Strana `) + fld("PAGE") + r(" od ") + fld("NUMPAGES") + "</w:p>";
  }
  const namesXml = names => names.map(nm => `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:ind w:right="1800"/>${rpr({sz: 14})}</w:pPr>${run(nm, {sz: 14})}</w:p>`).join("");

  async function izvezi(m, izvod, USTANOVE, TPL, kod, izdanje) {
    if (!window.JSZip) throw new Error("Biblioteka za DOCX izvoz nije učitana.");
    const joint = m.scope === "ZAJEDNICKI";
    const key = izvod || (joint ? "IDSS" : m.scope);
    const c = CFGS[key];
    const names = (joint && !izvod) ? [USTANOVE.IDSS.naziv, USTANOVE.IMH.naziv] : [USTANOVE[key].naziv];
    const code = joint ? "QP 10.ZS-02" : kod;
    const form = joint ? "Zapisnik sa zajedničkog sastanka uprave" : "Zapisnik sa sastanka";
    const zip = await JSZip.loadAsync(TPL[key], {base64: true});
    let doc = await zip.file("word/document.xml").async("string");
    const tijelo = body(m, c, {joint, izvod, names});
    doc = doc.replace("@@BODY@@", () => tijelo);
    zip.file("word/document.xml", doc);
    let ft = await zip.file("word/footer1.xml").async("string");
    const ctrlX = footerCtrl(c, code + (izvod ? " (izvod)" : ""), form + (izvod ? " – izvod" : ""), izdanje), namesX = namesXml(names);
    ft = ft.replace("@@CTRL@@", () => ctrlX).replace("@@NAMES@@", () => namesX);
    zip.file("word/footer1.xml", ft);
    return zip.generateAsync({type: "blob", compression: "DEFLATE", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  }
  return {izvezi};
})();

function preuzmi(blob, ime){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ime; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function nazivFajla(m, izv){
  const slug = s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40);
  return `Zapisnik_${m.scope}${izv?"_izvod_"+izv:""}_${(m.datum||"").slice(0,10)}_${slug(m.tema)}${m.status==="potvrdjen"?"":"_NACRT"}.docx`;
}

/* ============ ISPIS (obrazac QP 10.ZS-01) ============ */
function ispis(m, izvod){
  const A = izvod? USTANOVE[izvod].boja : USTANOVE[m.scope==="ZAJEDNICKI"?"IDSS":m.scope].boja;
  const naziv = izvod? USTANOVE[izvod].naziv : USTANOVE[m.scope].naziv;
  const ok = o => !izvod || o==="zajedničko" || o===izvod;
  const tacke=m.tacke.filter(t=>ok(t.oznaka)), zadaci=m.zadaci.filter(z=>z.zadatak&&ok(z.oznaka));
  document.documentElement.style.setProperty("--acc",A);
  $("#print").innerHTML = `
  <p>Broj zapisnika: ${esc(m.broj||"____")} &nbsp; Sarajevo, ${fmtDat(m.datum)}</p>
  <h1 style="text-align:center;color:${A};letter-spacing:3px;margin:6px 0">ZAPISNIK SA SASTANKA${izvod?" — IZVOD":""}</h1>
  <p style="text-align:center;font-style:italic;font-size:12px">${esc(naziv)}</p>
  <table><tr><th style="width:22%">Vrsta sastanka</th><td colspan="3">${esc(m.tip)}</td></tr>
  <tr><th>Tema</th><td colspan="3">${esc(m.tema)}</td></tr>
  <tr><th>Mjesto</th><td>${esc(m.mjesto)}</td><th style="width:16%">Datum</th><td>${fmtDat(m.datum)}</td></tr>
  <tr><th>Početak</th><td>${esc(m.pocetak)}</td><th>Završetak</th><td>${esc(m.kraj)}</td></tr>
  <tr><th>Povjerljivost</th><td>${esc(m.povjerljivost)}</td><th>Snimanje</th><td>${m.snimano?"da, uz saglasnost":"ne"}</td></tr></table>
  <h3>Prisutni</h3><table><tr><th>R.br.</th><th>Ime i prezime</th><th>Funkcija</th><th>Napomena</th></tr>${m.prisutni.filter(p=>p.ime).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.ime)}</td><td>${esc(p.uloga)}</td><td>${esc(p.napomena)}</td></tr>`).join("")}</table>
  <p style="font-size:12px">Opravdano odsutni: ${esc(m.odsutniOp)||"—"} · Neopravdano odsutni: ${esc(m.odsutniNeop)||"—"} · Bez prava glasa: ${esc(m.bezGlasa)||"—"}<br>Kvorum: ${esc(m.kvorum)} · Predsjedavajući: ${esc(m.predsjedavajuci)} · Zapisničar: ${esc(m.zapisnicar)}</p>
  <h3>Dnevni red i tok sastanka</h3>
  ${tacke.map((t,i)=>`<table style="page-break-inside:avoid"><tr><th colspan="2">Ad ${i+1}. ${esc(t.naslov)}</th></tr>
    <tr><td style="width:22%"><b>Rasprava</b></td><td>${esc(t.rasprava).replace(/\n/g,"<br>")}</td></tr>
    <tr><td><b>Glasanje</b></td><td>Za: ${esc(t.za)||"—"} · Protiv: ${esc(t.protiv)||"—"} · Suzdržani: ${esc(t.suzdrzani)||"—"} (${esc(t.nacin)})</td></tr>
    <tr><td><b>Zaključak</b></td><td>${esc(t.zakljucak).replace(/\n/g,"<br>")}</td></tr>
    <tr><td><b>Izdvojeno mišljenje</b></td><td>${esc(t.izdvojeno)}</td></tr></table>`).join("")}
  <h3>Zadaci i dogovori</h3><table><tr><th>R.br.</th><th>Zadatak</th><th>Odgovorna osoba</th><th>Krajnji rok</th><th>Status</th></tr>${zadaci.map((z,i)=>`<tr><td>${i+1}</td><td>${esc(z.zadatak)}</td><td>${esc(z.odgovorna)}</td><td>${fmtDat(z.rok)}</td><td>${esc(z.status)}</td></tr>`).join("")}</table>
  <p style="font-size:12px">Prilozi: ${esc(m.prilozi)||"—"} · Naredni sastanak: ${esc(m.naredni)||"—"}</p>
  <table><tr><th style="width:22%">Status</th><td>${m.status==="potvrdjen"?"Potvrđen":"NACRT"}</td><th style="width:22%">Potvrdio</th><td>${esc(m.potvrdio||"")} ${m.potvrdjenoKada?fmtDat(m.potvrdjenoKada):""}</td></tr>
  <tr><th>Zapisničar (potpis)</th><td style="height:50px"></td><th>Predsjedavajući (potpis)</th><td></td></tr></table>
  <div class="foot"><b style="color:${A}">${KOD_OBRASCA}</b> | Zapisnik sa sastanka | Izdanje ${IZDANJE}<br>${esc(naziv)}</div>`;
  window.print();
}

/* ============ ARHIVA ============ */
function arhiva(){
  const f = S.filter||"sve";
  const lista = S.meetings.filter(m=>f==="sve"||m.scope===f);
  $("#main").innerHTML = `<h2>Arhiva zapisnika</h2>
  <div class="row" style="max-width:400px"><div><label>Prikaži</label><select id="a_f"><option value="sve">Sve</option><option value="IDSS">IDSS</option><option value="IMH">IMH</option><option value="ZAJEDNICKI">Zajednički sastanci uprave</option></select></div></div>
  ${lista.length? lista.map(m=>`<div class="card"><span class="badge b-${m.scope}">${m.scope==="ZAJEDNICKI"?"Zajednički":m.scope}</span> <span class="badge st-${m.status}">${statusTekst(m.status)}</span>
    <b> ${esc(m.tema)}</b><br><span class="muted">${esc(m.tip)} · ${fmtDat(m.datum)} · ${esc(m.povjerljivost)}</span>
    <div class="actions"><button class="sec" data-o="${m.id}">Otvori</button>${["saglasnost","snimanje","obrada"].includes(m.status)?"":""}</div></div>`).join("") : `<p class="muted">Nema zapisnika.</p>`}`;
  $("#a_f").value=f; $("#a_f").onchange=e=>{ S.filter=e.target.value; arhiva(); };
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ S.cur=b.dataset.o; render(); });
}

function upute(){
  $("#main").innerHTML = `<h2>Upute</h2>
  <div class="card"><b>Tok:</b> priprema → saglasnost → snimanje (ili otprema audija) → obrada → pregled i ispravka → potvrda → arhiva i ispis.</div>
  <div class="card"><b>Zajednički sastanak uprave:</b> uz svaku tačku i zadatak bira se ustanova (IMH, IDSS ili zajedničko). Nakon potvrde moguće je ispisati izvod za IMH ili za IDSS; izvod sadrži samo tačke i zadatke te ustanove i zajedničke.</div>
  <div class="card"><b>Povjerljivost:</b> u Firebase načinu pristup određuju uloge po ustanovi (pravila pristupa u bazi). U DEMO načinu ta zaštita ne postoji.</div>
  <div class="card"><b>Ispis:</b> dugme „Ispis / PDF“ otvara ispis obrasca QP 10.ZS-01; u dijalogu odaberite „Sačuvaj kao PDF“.</div>
  <div class="card"><b>Način rada:</b> ${DEMO?"DEMO (podaci su samo u ovom pregledniku)":"povezano sa Firebase"}.</div>`;
}

window.addEventListener("beforeunload",e=>{ if(S.rec){ e.preventDefault(); e.returnValue=""; } });
init().catch(e=>{ $("#main").innerHTML=`<div class="note">Greška pri pokretanju: ${esc(e.message)}</div>`; });
</script>
