<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapisnici sastanaka — IMH i IDSS</title>
<style>
:root{
  --idss:#035EA1; --idss2:#08ABE6; --imh:#9F633F; --imh2:#2CB14D;
  --ink:#1b1b1b; --mut:#5b5b5b; --line:#d6d6d6; --bg:#f6f6f4; --card:#fff; --acc:#035EA1;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Century Gothic","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
header.top{background:#000;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
header.top .sp{flex:1}
header.top button{background:transparent;color:#fff;border:1px solid #777}
.stripe{height:4px;background:linear-gradient(90deg,var(--idss) 0 50%,var(--imh) 50% 100%)}
nav.tabs{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
nav.tabs button{background:#e8e8e5;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--card);font-weight:600}
main{background:var(--card);margin:0 20px 40px;border:1px solid var(--line);padding:22px;min-height:60vh}
h2{margin:0 0 14px;font-size:20px;color:var(--acc)}
h3{margin:22px 0 8px;font-size:15px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:6px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{background:#f0f0ee;color:#333}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--acc)}
button.dng{background:#a32020;border-color:#a32020}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;background:#fcfcfb}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff}
.b-IDSS{background:var(--idss)}.b-IMH{background:var(--imh)}.b-ZAJEDNICKI{background:#222}
.st-nacrt{background:#b36b00}.st-potvrdjen{background:#2a7d3d}.st-snimanje,.st-obrada{background:#555}
.note{background:#fff8e1;border:1px solid #e6cf85;padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.ok{background:#eef8ef;border-color:#9cc9a3}
table{border-collapse:collapse;width:100%;margin:6px 0}
@media screen and (max-width:700px){table{display:block;overflow-x:auto;max-width:100%}td,th,b,h1,h2,h3,p,div,span,label{overflow-wrap:anywhere}}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--acc);color:#fff;font-weight:600}
td input,td select,td textarea{border:none;padding:3px;min-height:0;background:transparent}
.rec{display:flex;align-items:center;gap:16px;margin:16px 0;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:#a32020;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.time{font-size:30px;font-variant-numeric:tabular-nums}
.muted{color:var(--mut);font-size:13px}
.hide{display:none!important}
.small{font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#print{display:none}
@media print{
  body{background:#fff}
  header.top,.stripe,nav.tabs,main{display:none!important}
  @page{size:A4;margin:0}
  #print{display:block;padding:0 12mm}
  #print .pw,#print .pw>thead>tr>td,#print .pw>tbody>tr>td,#print .pw>tfoot>tr>td{border:0!important;padding:0!important;margin:0}
  #print table th{background:var(--acc)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .foot{position:fixed;bottom:8mm;left:12mm;right:12mm;border-top:2px solid var(--acc);font-size:10px;padding-top:4px}
}
</style>
</head>

  <h1>Zapisnici sastanaka — IMH i IDSS</h1>

</header>

<main id="main"></main>

<script>/*@@GM@@*/</script>
<script>
/* ============ KONFIGURACIJA ============ */
// Firebase: kad se aplikacija objavi na Firebase Hostingu, postavke se učitavaju same (adresa /__/firebase/init.json).
// Za drugi hosting upišite postavke web aplikacije iz Firebase konzole. Ako ih nema, aplikacija radi u DEMO načinu
// (podaci ostaju samo u ovom pregledniku).
const FIREBASE_CONFIG = {apiKey:"", authDomain:"", projectId:"", storageBucket:"", appId:""};
const FIREBASE_VER = "10.12.2";
const KOD_OBRASCA = "QP 10.ZS-01", IZDANJE = "01";

const USTANOVE = {
  IDSS: {naziv: "Privatna ustanova INTERNATIONALE DEUTSCHE SCHULE SARAJEVO – Međunarodna njemačka škola Sarajevo", boja: "#035EA1"},
  IMH:  {naziv: "Privatna predškolska ustanova „International Montessori House“ Sarajevo", boja: "#9F633F"},
  ZAJEDNICKI: {naziv: "Zajednički sastanak uprave — IMH i IDSS", boja: "#222222"}
};
const TIPOVI = ["Razgovor sa zaposlenim","Individualni roditeljski sastanak","Grupni (razredni) roditeljski sastanak","Sastanak sa partnerom","Radni sastanak tima / stručnog organa","Drugo"];
const TIPOVI_ZAJ = ["Redovni sastanak uprave","Vanredni sastanak uprave","Strateški / planski sastanak","Drugo"];
const tipoviZa = sc => sc==="ZAJEDNICKI"? TIPOVI_ZAJ : TIPOVI;
const OZNAKE = ["IMH","IDSS","zajedničko"];

/* ============ POMOĆNE ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>{
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); (window.crypto&&crypto.getRandomValues? crypto.getRandomValues(b): b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256)));
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80; const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
let lsUpozoren=false;
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ if(!lsUpozoren){ lsUpozoren=true; alert("Podaci se ne mogu trajno sačuvati u ovom pregledniku (privatni prozor ili pun prostor). Preuzmite DOCX prije zatvaranja stranice."); } return false; } }
let memStore = {};
const lokalniDatum = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDat = d => { if(!d) return ""; if(/T\d\d:\d\d/.test(String(d))){ const x=new Date(d); if(!isNaN(x)) d=lokalniDatum(x); } const q=String(d).slice(0,10); return /^\d{4}-\d\d-\d\d$/.test(q) ? `${q.slice(8)}. ${q.slice(5,7)}. ${q.slice(0,4)}.` : esc(String(d)); };
const velikoSlovo = t => { t=String(t||"").trim(); return t? t.charAt(0).toLocaleUpperCase("bs")+t.slice(1) : t; };

/* ============ SKLADIŠTE PODATAKA ============ */
let DEMO = true;                 // postaje false tek kad se Firebase uspješno pokrene (init)
let fb = null;                   // {auth, db, ts}
const NAZIVI_GRESAKA = {
  "permission-denied":"Nemate pravo na ovu radnju, ili je zapisnik zaključan.",
  "unauthenticated":"Niste prijavljeni. Prijavite se ponovo.",
  "unavailable":"Veza sa serverom nije dostupna. Provjerite internet i pokušajte ponovo.",
  "deadline-exceeded":"Server nije odgovorio na vrijeme. Pokušajte ponovo.",
  "unauthorized":"Nemate pravo na ovu radnju."
};
function fbErr(e){
  const c = e && (e.code||"").replace(/^auth\//,"");
  if(e && e.message && /^(Obrada|Snimak|Sastanak|Sastanci|Nema|Neispravan|Prepoznavanje|Izrada|Nacrt|Zapisnik|Dio snimka|Gemini|Model|Prazan|Transkript)/.test(e.message)) return e; // naše poruke
  if(c && NAZIVI_GRESAKA[c]) return new Error(NAZIVI_GRESAKA[c]);
  return e;
}
function extZa(blob){
  const t=(blob.type||"").toLowerCase(), n=(blob.name||"").toLowerCase();
  if(t.includes("mp4")||t.includes("m4a")||/\.(m4a|mp4)$/.test(n)) return "m4a";
  if(t.includes("mpeg")||t.includes("mp3")||/\.mp3$/.test(n)) return "mp3";
  if(t.includes("wav")||/\.wav$/.test(n)) return "wav";
  if(t.includes("ogg")||/\.ogg$/.test(n)) return "ogg";
  if(t.includes("aac")||/\.aac$/.test(n)) return "aac";
  return "webm";
}
let saveQ = Promise.resolve();
const store = {
  async list(){
    if(DEMO){
      const stored = lsGet("zs_meetings", [])||[]; const byId = {};
      stored.forEach(x=>byId[x.id]=x); Object.values(memStore).forEach(x=>byId[x.id]=x);
      return Object.values(byId).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
    }
    // Upiti odgovaraju pravilima pristupa: direktor vidi sve u ustanovi; ostali vide opće/povjerljive i vlastite strogo povjerljive.
    const uid = S.user.id, col = fb.db.collection("meetings"), mem = S.mem||{}, qs = [];
    const up = i => ["direktor","uprava"].includes(mem[i]);
    const scopes = ["IMH","IDSS"].filter(i=>mem[i]);
    if(up("IMH") && up("IDSS")) scopes.push("ZAJEDNICKI");
    scopes.forEach(sc=>{
      const dir = sc==="ZAJEDNICKI" ? (mem.IMH==="direktor"&&mem.IDSS==="direktor") : mem[sc]==="direktor";
      if(dir) qs.push(col.where("scope","==",sc).get());
      else { qs.push(col.where("scope","==",sc).where("conf","==",false).get()); qs.push(col.where("scope","==",sc).where("createdBy","==",uid).get()); }
    });
    const res = await Promise.all(qs), byId = {};
    res.forEach(snap=>snap.forEach(d=>{ const r=d.data(); byId[d.id]={...r.podaci, id:d.id, status:r.status, scope:r.scope, _rev:r.rev}; }));
    return Object.values(byId).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  },
  save(m){
    const run = ()=>this._save(m);
    const p = saveQ.then(run, run); saveQ = p.catch(()=>{}); return p;
  },
  async _save(m){
    m.updated = new Date().toISOString();
    if(DEMO){
      memStore[m.id]=m;
      const all = lsGet("zs_meetings", [])||[]; const i = all.findIndex(x=>x.id===m.id);
      if(i>=0) all[i]=m; else all.push(m);
      lsSet("zs_meetings", all); return m;
    }
    const podaci = JSON.parse(JSON.stringify(m)); delete podaci._rev;
    const conf = m.povjerljivost==="Strogo povjerljivo";
    const ref = fb.db.collection("meetings").doc(m.id);
    try{
      if(!m._rev){
        await ref.set({scope:m.scope, status:m.status, podaci, conf, createdBy:S.user.id, createdAt:fb.ts(), rev:1});
        m._rev = 1; return m;
      }
      await fb.db.runTransaction(async tx=>{
        const snap = await tx.get(ref);
        if(!snap.exists || snap.data().rev !== m._rev) throw Object.assign(new Error("Zapisnik je u međuvremenu izmijenjen. Osvježite stranicu i ponovite izmjene."),{konflikt:true});
        const d = snap.data();
        const upd = {scope:d.scope, status:m.status, podaci, conf, createdBy:d.createdBy, createdAt:d.createdAt, rev:d.rev+1};
        if(m.status==="potvrdjen" && d.status!=="potvrdjen"){ upd.confirmedBy=S.user.id; upd.confirmedAt=fb.ts(); }
        tx.set(ref, upd);
      });
      m._rev += 1; return m;
    }catch(e){ throw fbErr(e); }
  },
  async consent(m){
    if(DEMO) return;
    // fiksni ID dokumenta ("main"): pravila bez njega ne dozvoljavaju prelaz u snimanje
    try{ await fb.db.collection("meetings").doc(m.id).collection("consents").doc("main").set({givenBy:m.saglasnost.dao, note:m.saglasnost.tekst||"", recordedBy:S.user.id, recordedAt:fb.ts()}); }
    catch(e){ throw fbErr(e); }
  },
  async audit(m, action){
    if(DEMO) return;
    try{ await fb.db.collection("meetings").doc(m.id).collection("audit").add({action, uid:S.user.id, at:fb.ts()}); }catch(e){ console.warn("dnevnik:", e.message); }
  },
  // Obrada u pregledniku: audio se šalje Googleu (Gemini), ključevi dolaze iz Firestorea (config/gemini).
  async process(m, napredak){
    let cfg;
    if(DEMO){ cfg = lsGet("zs_gemini", null); if(!cfg || !cfg.keys) return null; }
    else {
      try{ const d = await fb.db.collection("config").doc("gemini").get(); cfg = d.exists ? d.data() : null; }
      catch(e){ throw new Error("Nemate pravo na Gemini ključeve. Obradu može pokrenuti direktor ili uprava."); }
      if(!cfg || !cfg.keys) throw new Error("Gemini ključevi nisu postavljeni (Firestore: config/gemini, polje keys).");
    }
    const ring = new GM.KeyRing(cfg.keys), dijelovi = await aud.all(m.id);
    let transkript = m.transkript||"";
    if(dijelovi.length){
      const imaSaglasnost = DEMO ? !!(m.saglasnost && m.saglasnost.data) : (await fb.db.collection("meetings").doc(m.id).collection("consents").doc("main").get()).exists;
      if(!imaSaglasnost) throw new Error("Nema evidentirane saglasnosti za snimanje; snimak se ne obrađuje.");
      const kljuc="zs_part_"+m.id; let gotovi=[]; try{ gotovi=JSON.parse(localStorage.getItem(kljuc)||"[]"); }catch(e){}
      try{ transkript = await GM.transkribuj(ring, dijelovi.map(b=>({blob:b, mime:mimeZa(b)})), "bs", {model:cfg.model||undefined, napredak, gotovi,
        poDijelu:(i,t)=>{ gotovi[i]=t; try{ localStorage.setItem(kljuc, JSON.stringify(gotovi)); }catch(e){} } });
        try{ localStorage.removeItem(kljuc); }catch(e){} }
      catch(e){ console.error(e); throw new Error("Prepoznavanje govora nije uspjelo: "+e.message); }
      await this.audit(m, "transkript izrađen");   // u DEMO se ne bilježi
    }
    if(!transkript.trim()) throw new Error("Nema snimka ni transkripta za obradu.");
    let d;
    try{ d = await GM.nacrt(ring, transkript, (m.tacke||[]).map(t=>String(t.naslov||"")), {model:cfg.model||undefined, prisutni:(m.prisutni||[]).filter(p=>p.ime).map(p=>p.ime+(p.uloga?" ("+p.uloga+")":"")), datum:m.datum}); }
    catch(e){ console.error(e); throw new Error("Izrada nacrta nije uspjela: "+e.message); }
    return {minutes: GM.sastavi(m, d, transkript)};
  },
  // Snimak postoji samo na ovom računaru; "brisanje" znači brisanje lokalne kopije.
  async purge(m){
    try{ localStorage.removeItem("zs_part_"+m.id); }catch(e){}
    await aud.del(m.id); await this.audit(m, "snimak obrisan s računara"); return {ok:true};
  }
};

/* ============ LOKALNA POHRANA SNIMKA (IndexedDB; nikad na server) ============ */
function mimeZa(b){
  const t=(b.type||"").toLowerCase().split(";")[0];
  if(/^audio\/(webm|mp4|mpeg|wav|ogg|aac|x-wav|x-m4a)$/.test(t)) return t.replace("x-wav","wav").replace("x-m4a","mp4");
  if(t==="video/webm") return "audio/webm"; if(t==="video/mp4") return "audio/mp4";
  return "audio/webm";
}
const aud = (()=>{
  const mem = {}; let dbp = null;
  const open = ()=> dbp || (dbp = new Promise((ok,no)=>{ try{ const r=indexedDB.open("zs_audio",1); r.onupgradeneeded=()=>r.result.createObjectStore("seg"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } }));
  const tx = async (mode, fn)=>{ const db=await open(); return new Promise((ok,no)=>{ const t=db.transaction("seg",mode), st=t.objectStore("seg"); const rq=fn(st); t.oncomplete=()=>ok(rq&&rq.result); t.onerror=()=>no(t.error); t.onabort=()=>no(t.error); }); };
  return {
    async put(id,n,blob){ (mem[id]=mem[id]||{})[n]=blob; try{ await tx("readwrite",st=>st.put(blob,id+"|"+String(n).padStart(4,"0"))); }catch(e){ return false; } return true; },
    async all(id){
      let out={}; try{ const keys=await tx("readonly",st=>st.getAllKeys()); const mine=(keys||[]).filter(k=>k.startsWith(id+"|")).sort();
        for(const k of mine){ out[k.split("|")[1]] = await tx("readonly",st=>st.get(k)); } }catch(e){}
      Object.keys(mem[id]||{}).forEach(n=>{ out[String(n).padStart(4,"0")] = out[String(n).padStart(4,"0")] || mem[id][n]; });
      return Object.keys(out).sort().map(k=>out[k]).filter(Boolean);
    },
    async maxN(id){ let mx=0; try{ const keys=await tx("readonly",st=>st.getAllKeys()); (keys||[]).filter(k=>k.startsWith(id+"|")).forEach(k=>{ mx=Math.max(mx,parseInt(k.split("|")[1],10)||0); }); }catch(e){} Object.keys(mem[id]||{}).forEach(n=>{ mx=Math.max(mx,Number(n)||0); }); return mx; },
    async del(id){ delete mem[id]; try{ const keys=await tx("readonly",st=>st.getAllKeys()); for(const k of (keys||[]).filter(k=>k.startsWith(id+"|"))) await tx("readwrite",st=>st.delete(k)); }catch(e){} }
  };
})();

/* ============ STANJE ============ */
const S = {user:null, tab:"novi", meetings:[], cur:null, rec:null};

function prazanZapisnik(base){
  return Object.assign({
    id:uid(), created:new Date().toISOString(), status:"nacrt", scope:"IDSS", tip:TIPOVI[0], tema:"", mjesto:"", datum:lokalniDatum(),
    pocetak:"", kraj:"", povjerljivost:"Opći", broj:"", snimano:false,
    saglasnost:{data:false,dao:"",kada:"",tekst:""},
    prisutni:[{ime:"",uloga:"",napomena:""}], odsutniOp:"", odsutniNeop:"", bezGlasa:"",
    kvorum:"Nije potreban", predsjedavajuci:"", zapisnicar:"",
    dnevni:[{naslov:"",oznaka:"zajedničko"}],
    tacke:[], zadaci:[{zadatak:"",odgovorna:"",rok:"",status:"Otvoren",oznaka:"zajedničko"}],
    prilozi:"", naredni:"", transkript:"", potvrdio:"", potvrdjenoKada:"", audioObrisan:false, fazaSnimka:"nije"
  }, base||{});
}

/* ============ PRIJAVA ============ */
function ucitajSkriptu(src){ return new Promise((ok,no)=>{ const t=document.createElement("script"); t.src=src; t.onload=ok; t.onerror=()=>no(new Error("Nije moguće učitati "+src)); document.head.appendChild(t); }); }
async function firebasePokreni(){
  let cfg = FIREBASE_CONFIG.apiKey ? FIREBASE_CONFIG : null;
  if(!cfg && location.protocol.startsWith("http")){
    try{ const r = await fetch("/__/firebase/init.json"); if(r.ok){ const j = await r.json(); if(j && j.apiKey) cfg = j; } }catch(e){}
  }
  if(!cfg) return false;
  const B = "https://www.gstatic.com/firebasejs/"+FIREBASE_VER+"/firebase-";
  for(const p of ["app","auth","firestore"]) await ucitajSkriptu(B+p+"-compat.js");
  const app = firebase.initializeApp(cfg);
  fb = {auth:firebase.auth(), db:firebase.firestore(),
        ts:()=>firebase.firestore.FieldValue.serverTimestamp()};
  return true;
}
async function ucitajKorisnika(u){
  // Uloge dodjeljuje administrator (dokument memberships/<uid>); bez uloge se pristup ne odobrava.
  let mem = {};
  const d = await fb.db.collection("memberships").doc(u.uid).get();   // greška čitanja (npr. mreža) se prijavljuje, ne tumači kao „nema uloge“
  mem = d.exists ? d.data() : {};
  const UL = ["direktor","uprava","voditelj","clan"];
  ["IMH","IDSS"].forEach(i=>{ if(!UL.includes(mem[i])) delete mem[i]; });
  S.mem = mem;
  S.user = {email:u.email, id:u.uid, ime:mem.ime||u.displayName||u.email};
  return !!(mem.IMH||mem.IDSS);
}
async function init(){
  try{
    DEMO = !(await firebasePokreni());
  }catch(e){
    DEMO = true; S.initGreska = e.message;
  }
  if(!DEMO){
    const u = await new Promise(ok=>{ const off=fb.auth.onAuthStateChanged(x=>{ off(); ok(x); }); });
    if(u){ try{ const ima = await ucitajKorisnika(u); if(!ima){ S.bezUloge=true; await fb.auth.signOut(); S.user=null; } }catch(e){ S.initGreska="Podaci o ulozi se ne mogu učitati: "+e.message; S.user=null; } }
  } else {
    S.user = lsGet("zs_user", null);
  }
  render();
}
function prijava(){
  $("#tabs").innerHTML=""; $("#who").textContent=""; $("#logout").classList.add("hide");
  $("#main").innerHTML = `
  <h2>Prijava</h2>
  ${DEMO? `<div class="note"><b>DEMO način.</b> Podaci ostaju samo u ovom pregledniku, a obrada snimka radi ako u kartici Postavke upišete Gemini ključeve. Povezivanje s Firebase opisano je u uputama.${S.initGreska?" <br><b>Firebase se nije pokrenuo:</b> "+esc(S.initGreska):""}</div>`:""}
  ${S.bezUloge?`<div class="note">Vašem nalogu još nije dodijeljena uloga. Obratite se administratoru.</div>`:""}
  <div class="row" style="max-width:520px">
    <div><label>E-pošta</label><input id="em" type="email" autocomplete="username"></div>
    ${DEMO? `<div><label>Ime i prezime</label><input id="im"></div>`:`<div><label>Lozinka</label><input id="pw" type="password" autocomplete="current-password"></div>`}
  </div>
  <p id="perr" class="muted" style="color:#a32020"></p>
  <button id="go">Prijavi se</button>`;
  $("#go").onclick = async ()=>{
    const em=$("#em").value.trim();
    if(!em){ $("#perr").textContent="Unesite e-poštu."; return; }
    if(DEMO){
      const im=$("#im").value.trim(); if(!im){ $("#perr").textContent="Unesite ime i prezime."; return; }
      S.user={email:em,ime:im}; lsSet("zs_user",S.user); render();
    } else {
      try{
        const cr = await fb.auth.signInWithEmailAndPassword(em,$("#pw").value);
        const ima = await ucitajKorisnika(cr.user);
        if(!ima){ await fb.auth.signOut(); S.user=null; S.bezUloge=true; prijava(); return; }
        S.bezUloge=false; render();
      }catch(e){ $("#perr").textContent="Prijava nije uspjela: "+(/auth\/(invalid|wrong|user-not-found)/.test(e.code||"")?"pogrešna e-pošta ili lozinka.":e.message); }
    }
  };
}

/* ============ GLAVNI OKVIR ============ */
const tabovi = ()=> [["novi","Novi sastanak"],["arhiva","Arhiva"],["upute","Upute"]].concat(DEMO?[["postavke","Postavke"]]:[]);
async function render(){
  if(!S.user){ prijava(); return; }
  $("#who").textContent = S.user.ime||S.user.email;
  const lo=$("#logout"); lo.classList.remove("hide");
  lo.onclick = async ()=>{ if(!DEMO) await fb.auth.signOut(); S.user=null; S.mem=null; lsSet("zs_user",null); render(); };
  $("#tabs").innerHTML = tabovi().map(([k,t])=>`<button class="${S.tab===k?"on":""}" data-k="${k}">${t}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ if(S.rec&&!confirm("Snimanje je u toku. Napustiti ekran?"))return; S.tab=b.dataset.k; S.cur=null; render(); });
  try{ S.meetings = await store.list(); }catch(e){ $("#main").innerHTML=`<div class="note">Greška pri čitanju: ${esc(e.message)}</div>`; return; }
  if(S.cur) return radni();
  if(S.tab==="novi") return noviEkran();
  if(S.tab==="arhiva") return arhiva();
  if(S.tab==="postavke" && DEMO) return postavke();
  return upute();
}

/* ============ NOVI SASTANAK ============ */
function noviEkran(){
  $("#main").innerHTML = `
  <h2>Priprema sastanka</h2>
  <div class="row">
    <div><label>Ustanova</label><select id="n_sc">${Object.entries(USTANOVE).map(([k,v])=>`<option value="${k}">${k==="ZAJEDNICKI"?"Zajednički sastanak uprave (IMH + IDSS)":k}</option>`).join("")}</select></div>
    <div><label>Vrsta sastanka</label><select id="n_tip"><option value="">— izaberite vrstu —</option>${TIPOVI.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>
  </div>
  <label>Tema sastanka</label><input id="n_tema">
  <div class="row">
    <div><label>Mjesto</label><input id="n_mj"></div>
    <div><label>Datum</label><input id="n_dat" type="date" value="${lokalniDatum()}"></div>
    <div><label>Nivo povjerljivosti</label><select id="n_pov"><option>Opći</option><option>Povjerljiv</option><option>Strogo povjerljivo</option></select></div>
  </div>
  <div class="row">
    <div><label>Predsjedavajući</label><input id="n_pred"></div>
    <div><label>Zapisničar</label><input id="n_zap" value="${esc(S.user.ime||"")}"></div>
  </div>
  <label>Učesnici (jedan red = jedna osoba, format: Ime i prezime — funkcija)</label>
  <textarea id="n_uc" placeholder="Ime Prezime — direktor"></textarea>
  <label>Dnevni red (jedan red = jedna tačka; za zajednički sastanak dodajte oznaku na kraju reda: [IMH], [IDSS] ili [zajedničko])</label>
  <textarea id="n_dn" placeholder="Prva tačka\nDruga tačka"></textarea>
  <div class="actions"><button id="n_go">Nastavi na saglasnost i snimanje</button></div>`;
  $("#n_sc").onchange = e=>{ $("#n_tip").innerHTML = '<option value="">— izaberite vrstu —</option>'+tipoviZa(e.target.value).map(t=>`<option>${esc(t)}</option>`).join(""); };
  $("#n_go").onclick = ()=>{
    const sc=$("#n_sc").value;
    const prisutni = $("#n_uc").value.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{const [i,...u]=r.split(/\s[—–-]\s/); return {ime:i.trim(),uloga:(u.join(" – ")||"").trim(),napomena:""};});
    const dnevni = $("#n_dn").value.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{
      const m=r.match(/\s*\[(IMH|IDSS|zajedničko)\]\s*$/i); return {naslov:velikoSlovo(r.replace(/\s*\[[^\]]+\]\s*$/,"")), oznaka:m?m[1].replace(/^zajedničko$/i,"zajedničko"):(sc==="ZAJEDNICKI"?"zajedničko":sc)};
    });
    const m = prazanZapisnik({scope:sc,tip:$("#n_tip").value,tema:$("#n_tema").value.trim(),mjesto:$("#n_mj").value.trim(),datum:$("#n_dat").value,povjerljivost:$("#n_pov").value,predsjedavajuci:$("#n_pred").value.trim(),zapisnicar:$("#n_zap").value.trim(),
      prisutni:prisutni.length?prisutni:[{ime:"",uloga:"",napomena:""}], dnevni:dnevni.length?dnevni:[{naslov:"",oznaka:sc==="ZAJEDNICKI"?"zajedničko":sc}]});
    if(!m.tip){ alert("Izaberite vrstu sastanka."); return; }
    if(!m.tema){ alert("Unesite temu sastanka."); return; }
    m.tacke = m.dnevni.map(d=>({naslov:d.naslov,oznaka:d.oznaka,rasprava:"",za:"",protiv:"",suzdrzani:"",nacin:"Bez glasanja",zakljucak:"",izdvojeno:""}));
    m.status="saglasnost";
    store.save(m).then(()=>{ S.cur=m.id; render(); }).catch(e=>alert("Greška: "+e.message));
  };
}

/* ============ RADNI EKRAN (saglasnost → snimanje → obrada → pregled) ============ */
function cur(){ return S.meetings.find(m=>m.id===S.cur); }
function zaglavljeSastanka(m){
  return `<p><span class="badge b-${esc(m.scope)}">${m.scope==="ZAJEDNICKI"?"Zajednički":esc(m.scope)}</span> <span class="badge st-${esc(m.status)}">${statusTekst(m.status)}</span> &nbsp;<b>${esc(m.tema)}</b> <span class="muted">· ${esc(m.tip)} · ${fmtDat(m.datum)}</span></p>`;
}
function statusTekst(s){ return {saglasnost:"saglasnost",snimanje:"snimanje",obrada:"obrada",nacrt:"nacrt",potvrdjen:"potvrđen"}[s]||s; }
function radni(){
  const m=cur(); if(!m){ S.cur=null; return render(); }
  document.documentElement.style.setProperty("--acc", USTANOVE[m.scope==="ZAJEDNICKI"?"IDSS":m.scope].boja);
  if(m.status==="saglasnost") return ekranSaglasnost(m);
  if(m.status==="snimanje") return ekranSnimanje(m);
  if(m.status==="obrada") return ekranObrada(m);
  return ekranPregled(m);
}

function ekranSaglasnost(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`
  <h2>Saglasnost za snimanje</h2>
  <div class="note">Snimanje je dozvoljeno samo uz saglasnost <b>svih prisutnih</b>. Saglasnost se evidentira prije početka. Snimak se briše nakon potvrde zapisnika.</div>
  <label><input type="checkbox" id="s_da" style="width:auto"> Svi prisutni su obaviješteni o snimanju i saglasni su.</label>
  <label>Ko je saglasnost evidentirao (ime i prezime)</label><input id="s_ko" value="${esc(S.user.ime||"")}">
  <div class="actions">
    <button id="s_sn" disabled>Nastavi na snimanje</button>
    <button id="s_bez" class="sec">Nastavi bez snimanja (ručni unos)</button>
  </div>`;
  const prov=()=>{ $("#s_sn").disabled = !($("#s_da").checked && $("#s_ko").value.trim()); };
  $("#s_da").onchange=prov; $("#s_ko").oninput=prov;
  $("#s_sn").onclick=async()=>{
    m.saglasnost={data:true,dao:$("#s_ko").value.trim(),kada:new Date().toISOString(),tekst:"Svi prisutni obaviješteni i saglasni sa snimanjem."};
    m.snimano=true; m.status="snimanje";
    try{ await store.consent(m); await store.save(m);}catch(e){ alert("Greška: "+e.message); return; }
    render();
  };
  $("#s_bez").onclick=async()=>{ m.snimano=false; m.status="nacrt"; await store.save(m); render(); };
}

function fmtT(s){ const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60; return [h,mm,ss].map(x=>String(x).padStart(2,"0")).join(":"); }
function ekranSnimanje(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`
  <h2>Snimanje</h2>
  <div class="note">Ne zaključavajte ekran i ne prelazite u drugu aplikaciju dok traje snimanje. Za duge sastanke koristite laptop s mikrofonom na stolu.</div>
  <div class="rec"><span id="r_dot" class="dot hide"></span><span class="time" id="r_t">00:00:00</span>
    <button id="r_start">Počni snimanje</button><button id="r_stop" class="dng hide">Završi snimanje</button></div>
  <p id="r_msg" class="muted" role="status" aria-live="polite"></p>
  <h3>Ili učitajte gotov audio zapis</h3>
  <input type="file" id="r_file" accept="audio/*">
  <div id="r_prev"></div>
  <h3>Ili zalijepite transkript (za probu bez prepoznavanja govora)</h3>
  <textarea id="r_tr" placeholder="Tekst razgovora…">${esc(m.transkript||"")}</textarea>
  <div class="actions"><button id="r_next" class="sec">Nastavi na obradu</button></div>`;
  let chunks=[], segNo=0, t0=0, tick=null, rot=null, mr=null, stream=null, wl=null, failed=0, uploaded=false, rotira=false, mt=null;
  const SEG_MS = window.__SEG_MS || 20*60*1000;     // snimak se dijeli na samostalne dijelove od po 20 minuta (svaki ostaje ispod ograničenja Geminija)
  const msg=t=>$("#r_msg").textContent=t;
  async function prikaziDijelove(trajanje){
    const dij = await aud.all(m.id);
    $("#r_prev").innerHTML = (trajanje!=null?`<p>Snimak završen (${fmtT(trajanje)}). Čuva se samo na ovom računaru.</p>`:"") +
      dij.map((b,i)=>{ const u=URL.createObjectURL(b); return `<p>Dio ${i+1} (${Math.round(b.size/1024)} KB)<br><audio controls src="${u}"></audio><br><a download="snimak-${m.id}-dio${i+1}.${extZa(b)}" href="${u}">Preuzmi dio ${i+1}</a></p>`; }).join("");
  }
  function pokreniDio(){
    chunks=[]; const my=++segNo;
    mr = new MediaRecorder(stream, Object.assign(mt?{mimeType:mt}:{}, {audioBitsPerSecond:32000}));
    mr.ondataavailable = ev=>{
      if(!ev.data.size) return; chunks.push(ev.data);
      aud.put(m.id, my, new Blob(chunks,{type:mr.mimeType||"audio/webm"})).then(ok=>{ if(!ok){ failed++; msg("Upozorenje: snimak se ne može sačuvati na disk preglednika; ostaje samo u memoriji. Ne zatvarajte stranicu."); } });
    };
    mr.onstop = ()=>{
      if(rotira){ rotira=false; try{ pokreniDio(); }catch(e){ msg("Snimanje se prekinulo: "+e.message); zavrsi(); } return; }
      zavrsi();
    };
    mr.start(30000); S.rec=mr;
  }
  function zavrsi(){
    stream.getTracks().forEach(t=>t.stop()); clearInterval(tick); clearInterval(rot); if(wl){try{wl.release();}catch(e){}}
    S.rec=null; $("#r_dot").classList.add("hide"); $("#r_stop").classList.add("hide"); $("#r_start").classList.add("hide");
    setTimeout(()=>prikaziDijelove(Math.round((Date.now()-t0)/1000)), 400);
    m.fazaSnimka="snimljeno"; m.kraj = m.kraj || new Date().toTimeString().slice(0,5); store.save(m);
  }
  $("#r_start").onclick=async()=>{
    if(uploaded){ msg("Već ste učitali audio zapis. Snimanje i učitavanje ne miješajte u istom sastanku."); return; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ msg("Mikrofon nije dostupan: "+e.message+". Možete učitati gotov audio zapis."); return; }
    mt = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
    try{ if(navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); }catch(e){}
    segNo = await aud.maxN(m.id);   // nakon ponovnog učitavanja stranice novi dijelovi se dodaju, ne prepisuju postojeće
    try{ pokreniDio(); }catch(e){ msg("Snimanje nije moguće: "+e.message); stream.getTracks().forEach(t=>t.stop()); return; }
    t0=Date.now(); m.pocetak = m.pocetak || new Date().toTimeString().slice(0,5);
    $("#r_dot").classList.remove("hide"); $("#r_stop").classList.remove("hide"); $("#r_start").classList.add("hide");
    tick=setInterval(()=>$("#r_t").textContent=fmtT(Math.round((Date.now()-t0)/1000)),500);
    rot=setInterval(()=>{ if(mr && mr.state==="recording"){ rotira=true; try{ mr.stop(); }catch(e){ rotira=false; } } }, SEG_MS);
    msg("Snimanje je u toku. Snimak se čuva na ovom računaru (ne šalje se na server) i dijeli na dijelove od 20 minuta.");
  };
  $("#r_stop").onclick=()=>{ rotira=false; try{ mr.stop(); }catch(e){} };
  $("#r_file").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(S.rec || segNo || (await aud.maxN(m.id))){ msg("Već ste snimali u ovom sastanku. Audio zapis učitajte u novom sastanku."); e.target.value=""; return; }
    if(uploaded){ msg("Audio zapis je već učitan. Za drugi zapis napravite novi sastanak."); e.target.value=""; return; }
    if(!f.size){ msg("Odabrani zapis je prazan (0 KB)."); e.target.value=""; return; }
    if(f.type && !/^(audio|video)\//.test(f.type)){ msg("Odabrana datoteka nije audio zapis ("+f.type+")."); e.target.value=""; return; }
    if(f.size > 14*1024*1024){ msg("Zapis je prevelik ("+Math.round(f.size/1048576)+" MB; najviše 14 MB, oko jedan sat). Podijelite ga na kraće dijelove."); e.target.value=""; return; }
    if(!(await aud.put(m.id,1,f))){ msg("Zapis se ne može sačuvati na disk preglednika; ostaje u memoriji dok ne zatvorite stranicu."); }
    uploaded=true; m.fazaSnimka="otpremljeno"; await store.save(m); await prikaziDijelove(null); msg("Zapis je učitan (ostaje na ovom računaru).");
  };
  prikaziDijelove(null);
  $("#r_next").onclick=async()=>{
    if(S.rec){ alert("Prvo završite snimanje."); return; }
    if(failed && !confirm("Snimak se nije mogao sačuvati na disk preglednika. Ako se stranica zatvori, snimak je izgubljen. Nastaviti svejedno?")) return;
    $("#r_next").disabled=true;
    m.transkript=$("#r_tr").value; m.status="obrada";
    try{ await store.save(m); }catch(e){ alert("Greška: "+e.message); $("#r_next").disabled=false; return; }
    render();
  };
}

function nacrtIzTranskripta(m){
  // DEMO: bez prepoznavanja govora i bez jezičkog modela; ništa se ne izmišlja.
  /* DEMO bez ključeva: ništa se ne upisuje u tačke (ne izmišlja se) */
  return m;
}
function ekranObrada(m){
  $("#main").innerHTML = zaglavljeSastanka(m)+`<h2>Obrada snimka</h2><p class="muted">Sadržaj sastanka se šalje Googleu (besplatni Gemini) – odluka Direktora.</p><p id="ob" class="muted" role="status" aria-live="polite">Obrada je u toku…</p><div class="actions"><button id="ob_retry" class="hide">Pokušaj ponovo</button> <button id="ob_skip" class="sec hide">Nastavi s ručnim unosom</button></div>`;
  S.obrada = S.obrada || {};
  if(S.obrada[m.id]) return;
  S.obrada[m.id] = true;
  (async()=>{
    try{
      const r = await store.process(m, (i,n)=>{ const el=$("#ob"); if(el) el.textContent="Prepoznavanje govora: dio "+i+" od "+n+"…"; });
      if(r && r.minutes){ Object.assign(m, r.minutes, {id:m.id,scope:m.scope}); $("#ob").textContent="Obrada završena. Nacrt je spreman za pregled."; }
      else { nacrtIzTranskripta(m); $("#ob").innerHTML = `<b>Obrada nije izvršena:</b> u DEMO načinu nisu upisani Gemini ključevi (kartica „Postavke“). Napravljen je prazan nacrt iz dnevnog reda${m.transkript?"; transkript je sačuvan uz zapisnik":""}. Zapisnik se ne može potvrditi dok se ne unese tok sastanka.`; }
      m.status="nacrt"; await store.save(m);
      delete S.obrada[m.id];
      setTimeout(render,900);
    }catch(e){
      delete S.obrada[m.id];
      const el=$("#ob"); if(el){ el.innerHTML=`Obrada nije uspjela: ${esc(e.message)}`; $("#ob_skip").classList.remove("hide"); $("#ob_retry").classList.remove("hide"); $("#ob_retry").onclick=()=>render();
      $("#ob_skip").onclick=async()=>{ try{ m.status="nacrt"; await store.save(m); render(); }catch(e2){ alert("Greška: "+e2.message); } }; }
    }
  })();
}

/* ============ PREGLED I ISPRAVKA NACRTA ============ */

  </div>
  <p class="muted">Snimanje: ${m.snimano?`da, uz saglasnost (evidentirao/la ${esc(m.saglasnost.dao)}, ${m.saglasnost.kada?new Date(m.saglasnost.kada).toLocaleString("bs-Latn-BA"):""})`:"ne"}</p>
  <h3>2. Prisutni</h3>

  <h3>3. Tok sastanka po tačkama</h3>
  ${m.tacke.map((t,i)=>`<div class="card"><b>Ad ${i+1}.</b>
    <div class="row"><div><label>Naziv tačke</label>${inp(`tacke.${i}.naslov`,t.naslov)}</div>${jz?`<div><label>Ustanova</label><select ${d} data-p="tacke.${i}.oznaka">${OZNAKE.map(o=>`<option ${o===t.oznaka?"selected":""}>${o}</option>`).join("")}</select></div>`:""}</div>
    <label>Rasprava</label><textarea ${d} data-p="tacke.${i}.rasprava">${esc(t.rasprava)}</textarea>
    <div class="row"><div><label>Za</label>${inp(`tacke.${i}.za`,t.za)}</div><div><label>Protiv</label>${inp(`tacke.${i}.protiv`,t.protiv)}</div><div><label>Suzdržani</label>${inp(`tacke.${i}.suzdrzani`,t.suzdrzani)}</div>
    <div><label>Način</label><select ${d} data-p="tacke.${i}.nacin">${["Javno","Tajno","Bez glasanja"].map(o=>`<option ${o===t.nacin?"selected":""}>${o}</option>`).join("")}</select></div></div>
    <label>Zaključak</label><textarea ${d} data-p="tacke.${i}.zakljucak" style="min-height:60px">${esc(t.zakljucak)}</textarea>
    <label>Izdvojeno mišljenje</label>${inp(`tacke.${i}.izdvojeno`,t.izdvojeno)}</div>`).join("")}
  ${lock?"":`<button class="sec" data-add="tacke">+ tačka</button>`}
  <h3>4. Zadaci i dogovori</h3>
  <table><tr><th>R.br.</th><th>Zadatak / dogovor</th><th>Odgovorna osoba</th><th>Krajnji rok</th><th>Status</th>${jz?"<th>Ustanova</th>":""}</tr>
  ${m.zadaci.map((z,i)=>`<tr><td>${i+1}</td><td>${inp(`zadaci.${i}.zadatak`,z.zadatak)}</td><td>${inp(`zadaci.${i}.odgovorna`,z.odgovorna)}</td><td>${inp(`zadaci.${i}.rok`,z.rok,"","date")}</td>
   <td><select ${d} data-p="zadaci.${i}.status">${["Otvoren","U toku","Završen"].map(o=>`<option ${o===z.status?"selected":""}>${o}</option>`).join("")}</select></td>${jz?`<td><select ${d} data-p="zadaci.${i}.oznaka">${OZNAKE.map(o=>`<option ${o===z.oznaka?"selected":""}>${o}</option>`).join("")}</select></td>`:""}</tr>`).join("")}</table>
  ${lock?"":`<button class="sec" data-add="zadaci">+ zadatak</button>`}
  <div class="row"><div><label>Prilozi</label>${inp("prilozi",m.prilozi)}</div><div><label>Naredni sastanak</label>${inp("naredni",m.naredni)}</div></div>
  ${m.transkript?`<h3>Transkript (radni materijal)</h3><textarea disabled style="min-height:80px">${esc(m.transkript)}</textarea>`:""}
  <div class="actions">
    ${lock?"":`<button id="p_save" class="sec">Sačuvaj nacrt</button><button id="p_ok">Potvrdi zapisnik</button>`}
    <button id="p_docx" class="sec">Preuzmi DOCX (uredivo)</button>
    ${lock&&m.snimano?`<button id="p_purge" class="sec">Obriši snimak s ovog računara</button>`:""}
    <button id="p_print" class="sec">Ispis / PDF</button>
    ${jz&&lock?`<button class="sec" id="p_ix1">Izvod za IMH (PDF)</button><button class="sec" id="p_ix2">Izvod za IDSS (PDF)</button><button class="sec" id="p_dx1">Izvod za IMH (DOCX)</button><button class="sec" id="p_dx2">Izvod za IDSS (DOCX)</button>`:""}
    <button id="p_back" class="sec">Nazad na arhivu</button>
  </div>`;
  const setPath=(o,p,v)=>{ const k=p.split("."); let c=o; for(let i=0;i<k.length-1;i++) c=c[k[i]]; c[k[k.length-1]]=v; };
  const sakupi=()=>{ document.querySelectorAll("#main [data-p]").forEach(e=>setPath(m,e.dataset.p,e.value)); };
  document.querySelectorAll("#main [data-add]").forEach(b=>b.onclick=()=>{
    sakupi(); const def = jz?"zajedničko":m.scope;
    if(b.dataset.add==="prisutni") m.prisutni.push({ime:"",uloga:"",napomena:""});
    if(b.dataset.add==="tacke") m.tacke.push({naslov:"",oznaka:def,rasprava:"",za:"",protiv:"",suzdrzani:"",nacin:"Bez glasanja",zakljucak:"",izdvojeno:""});
    if(b.dataset.add==="zadaci") m.zadaci.push({zadatak:"",odgovorna:"",rok:"",status:"Otvoren",oznaka:def});
    ekranPregled(m);
  });
  if(!lock){
    $("#p_save").onclick=async()=>{ sakupi(); await store.save(m); alert("Nacrt je sačuvan."); };
    $("#p_ok").onclick=async()=>{
      sakupi();
      const bezSadrzaja = !m.tacke.some(t=>(t.rasprava||"").trim()||(t.zakljucak||"").trim());
      if(bezSadrzaja){ alert("Zapisnik se ne može potvrditi: nijedna tačka dnevnog reda nema raspravu ni zaključak.\n\nPokrenite obradu snimka/transkripta (u DEMO načinu su potrebni Gemini ključevi u Postavkama) ili unesite tok sastanka ručno."); return; }
      const problemi=[];
      m.tacke.forEach((t,i)=>{ if(!(t.rasprava||"").trim()&&!(t.zakljucak||"").trim()) problemi.push(`Ad ${i+1}: nema rasprave ni zaključka`); });
      if(!(m.broj||"").trim()) problemi.push("Nije upisan broj zapisnika");
      if(!m.pocetak||!m.kraj) problemi.push("Nije upisano vrijeme početka ili završetka");
      m.zadaci.filter(z=>z.zadatak.trim()).forEach((z,i)=>{ if(!z.odgovorna.trim()) problemi.push(`Zadatak ${i+1}: nema odgovorne osobe`); if(!z.rok) problemi.push(`Zadatak ${i+1}: nema krajnjeg roka`); });
      if(m.pocetak&&m.kraj&&m.kraj<=m.pocetak) problemi.push("Vrijeme završetka nije poslije početka");
      { const imena=m.prisutni.map(p=>(p.ime||"").trim().toLowerCase()).filter(Boolean);
        if(new Set(imena).size<imena.length) problemi.push("Isti učesnik je upisan više puta");
        const danas=lokalniDatum();
        m.zadaci.filter(z=>z.zadatak.trim()).forEach((z,i)=>{ if(z.rok&&m.datum&&z.rok<m.datum) problemi.push(`Zadatak ${i+1}: rok je prije datuma sastanka`);
          else if(z.rok&&z.rok<danas) problemi.push(`Zadatak ${i+1}: rok je već prošao`); }); }
      if(!m.predsjedavajuci.trim()) problemi.push("Nije upisan predsjedavajući");
      if(!m.zapisnicar.trim()) problemi.push("Nije upisan zapisničar");
      if(JSON.stringify(m).includes("[nejasno")) problemi.push("U zapisniku su još označena mjesta [nejasno]");
      if(problemi.length && !confirm("Prije potvrde provjerite:\n\n- "+problemi.join("\n- ")+"\n\nPotvrditi svejedno?")) return;
      if(!confirm("Potvrditi zapisnik? Nakon potvrde se više ne može mijenjati.")) return;
      m.status="potvrdjen"; m.potvrdio=S.user.ime||S.user.email; m.potvrdjenoKada=new Date().toISOString();
      try{ await store.save(m); }catch(e){ m.status="nacrt"; m.potvrdio=""; m.potvrdjenoKada=""; alert("Potvrda nije uspjela: "+e.message); return; }
      if(m.snimano){ try{ await store.purge(m); }catch(e){ alert("Zapisnik je potvrđen, ali snimak nije obrisan: "+e.message+"\nObrišite ga dugmetom „Obriši snimak“ u potvrđenom zapisniku."); } }
      render();
    };
  }
  const dx = izv => async()=>{ sakupi(); if(!lock) await store.save(m);
    try{ const blob = await DX.izvezi(m, izv, USTANOVE, TPL, KOD_OBRASCA, IZDANJE); preuzmi(blob, nazivFajla(m, izv)); }catch(e){ alert("DOCX izvoz nije uspio: "+e.message); } };
  $("#p_docx").onclick=dx(null);
  if($("#p_purge")) $("#p_purge").onclick=async()=>{ try{ const r=await store.purge(m); alert("Snimak je obrisan"+(r&&r.obrisano!=null?" ("+r.obrisano+" fajl.)":"")+"."); }catch(e){ alert("Brisanje nije uspjelo: "+e.message); } };
  $("#p_print").onclick=()=>ispis(m);
  if(jz&&lock){ $("#p_ix1").onclick=()=>ispis(m,"IMH"); $("#p_ix2").onclick=()=>ispis(m,"IDSS"); $("#p_dx1").onclick=dx("IMH"); $("#p_dx2").onclick=dx("IDSS"); }
  $("#p_back").onclick=()=>{ S.cur=null; S.tab="arhiva"; render(); };
}

/*@@TPL@@*/
/*@@DX@@*/
function preuzmi(blob, ime){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ime; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function nazivFajla(m, izv){
  const slug = s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40);
  return `Zapisnik_${m.scope}${izv?"_izvod_"+izv:""}_${(m.datum||"").slice(0,10)}_${slug(m.tema)}${m.status==="potvrdjen"?"":"_NACRT"}.docx`;
}

/* ============ ISPIS (obrazac QP 10.ZS-01) ============ */
function ispis(m, izvod){
  const A = izvod? USTANOVE[izvod].boja : USTANOVE[m.scope==="ZAJEDNICKI"?"IDSS":m.scope].boja;
  const naziv = izvod? USTANOVE[izvod].naziv : USTANOVE[m.scope].naziv;
  const ok = o => !izvod || o==="zajedničko" || o===izvod;
  const tacke=m.tacke.filter(t=>ok(t.oznaka)), zadaci=m.zadaci.filter(z=>z.zadatak&&ok(z.oznaka));
  document.documentElement.style.setProperty("--acc",A);
  $("#print").innerHTML = `<table class="pw"><thead><tr><td><div style="height:14mm"></div></td></tr></thead><tbody><tr><td>
  <p>Broj zapisnika: ${esc(m.broj||"____")} &nbsp; Sarajevo, ${fmtDat(m.datum)}</p>
  <h1 style="text-align:center;color:${A};letter-spacing:3px;margin:6px 0">ZAPISNIK SA SASTANKA${izvod?" — IZVOD":""}</h1>
  <p style="text-align:center;font-style:italic;font-size:12px">${esc(naziv)}</p>
  <table><tr><th style="width:22%">Vrsta sastanka</th><td colspan="3">${esc(m.tip)}</td></tr>
  <tr><th>Tema</th><td colspan="3">${esc(m.tema)}</td></tr>
  <tr><th>Mjesto</th><td>${esc(m.mjesto)}</td><th style="width:16%">Datum</th><td>${fmtDat(m.datum)}</td></tr>
  <tr><th>Početak</th><td>${esc(m.pocetak)}</td><th>Završetak</th><td>${esc(m.kraj)}</td></tr>
  <tr><th>Povjerljivost</th><td>${esc(m.povjerljivost)}</td><th>Snimanje</th><td>${m.snimano?"da, uz saglasnost":"ne"}</td></tr></table>
  <h3>Prisutni</h3><table><tr><th>R.br.</th><th>Ime i prezime</th><th>Funkcija</th><th>Napomena</th></tr>${m.prisutni.filter(p=>p.ime).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.ime)}</td><td>${esc(p.uloga)}</td><td>${esc(p.napomena)}</td></tr>`).join("")}</table>
  <p style="font-size:12px">Opravdano odsutni: ${esc(m.odsutniOp)||"—"} · Neopravdano odsutni: ${esc(m.odsutniNeop)||"—"} · Bez prava glasa: ${esc(m.bezGlasa)||"—"}<br>Kvorum: ${esc(m.kvorum)} · Predsjedavajući: ${esc(m.predsjedavajuci)} · Zapisničar: ${esc(m.zapisnicar)}</p>
  <h3>Dnevni red i tok sastanka</h3>
  ${tacke.map((t,i)=>`<table style="page-break-inside:avoid"><tr><th colspan="2">Ad ${i+1}. ${esc(velikoSlovo(t.naslov))}</th></tr>
    <tr><td style="width:22%"><b>Rasprava</b></td><td>${esc(t.rasprava).replace(/\n/g,"<br>")}</td></tr>
    <tr><td><b>Glasanje</b></td><td>${(t.nacin==="Bez glasanja" && !t.za && !t.protiv && !t.suzdrzani) ? "Bez glasanja" : `Za: ${esc(t.za)||"—"} · Protiv: ${esc(t.protiv)||"—"} · Suzdržani: ${esc(t.suzdrzani)||"—"} (${esc(t.nacin)})`}</td></tr>
    <tr><td><b>Zaključak</b></td><td>${esc(t.zakljucak).replace(/\n/g,"<br>")}</td></tr>
    <tr><td><b>Izdvojeno mišljenje</b></td><td>${esc(t.izdvojeno)}</td></tr></table>`).join("")}
  <h3>Zadaci i dogovori</h3><table><tr><th>R.br.</th><th>Zadatak</th><th>Odgovorna osoba</th><th>Krajnji rok</th><th>Status</th></tr>${zadaci.map((z,i)=>`<tr><td>${i+1}</td><td>${esc(z.zadatak)}</td><td>${esc(z.odgovorna)}</td><td>${fmtDat(z.rok)}</td><td>${esc(z.status)}</td></tr>`).join("")||`<tr><td colspan="5">Nema dogovorenih zadataka.</td></tr>`}</table>
  <p style="font-size:12px">Prilozi: ${esc(m.prilozi)||"—"} · Naredni sastanak: ${esc(m.naredni)||"—"}</p>
  <table><tr><th style="width:22%">Status</th><td>${m.status==="potvrdjen"?"Potvrđen":"NACRT"}</td><th style="width:22%">Potvrdio</th><td>${esc(m.potvrdio||"")} ${m.potvrdjenoKada?fmtDat(m.potvrdjenoKada):""}</td></tr>
  <tr><th>Zapisničar (potpis)</th><td style="height:50px"></td><th>Predsjedavajući (potpis)</th><td></td></tr></table>
  </td></tr></tbody><tfoot><tr><td><div style="height:24mm"></div></td></tr></tfoot></table>
  <div class="foot"><b style="color:${A}">${KOD_OBRASCA}</b> | Zapisnik sa sastanka | Izdanje ${IZDANJE}<br>${esc(naziv)}</div>`;
  window.print();
}

/* ============ ARHIVA ============ */
function arhiva(){
  const f = S.filter||"sve";
  const lista = S.meetings.filter(m=>f==="sve"||m.scope===f);
  $("#main").innerHTML = `<h2>Arhiva zapisnika</h2>
  <div class="row" style="max-width:400px"><div><label>Prikaži</label><select id="a_f"><option value="sve">Sve</option><option value="IDSS">IDSS</option><option value="IMH">IMH</option><option value="ZAJEDNICKI">Zajednički sastanci uprave</option></select></div></div>
  ${lista.length? lista.map(m=>`<div class="card"><span class="badge b-${esc(m.scope)}">${m.scope==="ZAJEDNICKI"?"Zajednički":esc(m.scope)}</span> <span class="badge st-${esc(m.status)}">${statusTekst(m.status)}</span>
    <b> ${esc(m.tema)}</b><br><span class="muted">${esc(m.tip)} · ${fmtDat(m.datum)} · ${esc(m.povjerljivost)}</span>
    <div class="actions"><button class="sec" data-o="${m.id}">Otvori</button>${["saglasnost","snimanje","obrada"].includes(m.status)?"":""}</div></div>`).join("") : `<p class="muted">Nema zapisnika.</p>`}`;
  $("#a_f").value=f; $("#a_f").onchange=e=>{ S.filter=e.target.value; arhiva(); };
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ S.cur=b.dataset.o; render(); });
}

function postavke(){
  const c = lsGet("zs_gemini", null) || {};
  $("#main").innerHTML = `<h2>Postavke obrade (DEMO način)</h2>
  <div class="note">Ovdje upišite Gemini ključeve (jedan po redu ili odvojeni zarezom). Ključevi se čuvaju samo u ovom pregledniku, na ovom računaru. Aplikacija ih koristi redom (rotacija); ako ključ dostigne ograničenje, prelazi na idući.
  <br><b>Besplatni Gemini:</b> Google može koristiti poslani sadržaj za razvoj svojih proizvoda, a ljudi ga mogu pročitati (odluka Direktora: šalje se sve).</div>
  <label>Gemini ključevi</label><textarea id="g_k" rows="5" placeholder="AIza…">${esc(c.keys||"")}</textarea>
  <label>Model (nije obavezno; zadano gemini-2.5-flash)</label><input id="g_m" value="${esc(c.model||"")}" placeholder="gemini-2.5-flash">
  <div class="actions"><button id="g_s">Sačuvaj</button><button id="g_t" class="sec">Provjeri ključeve</button></div><div id="g_r" class="muted" style="margin-top:8px"></div>`;
  const uzmi=()=>({keys:$("#g_k").value.trim(), model:$("#g_m").value.trim()});
  $("#g_s").onclick=()=>{ const ok=lsSet("zs_gemini", uzmi()); $("#g_r").textContent = ok!==false ? "Sačuvano ("+(uzmi().keys.split(/[\s,;]+/).filter(Boolean).length)+" ključeva)." : "Čuvanje nije uspjelo (preglednik blokira pohranu)."; };
  $("#g_t").onclick=async()=>{
    $("#g_r").textContent="Provjera u toku…";
    try{ const r = await GM.provjeriKljuceve(uzmi().keys, uzmi().model||undefined);
      $("#g_r").innerHTML = r.map(x=>`Ključ ${x.i}: ${x.ok?"radi":"NE radi ("+esc(x.poruka)+")"}`).join("<br>"); }
    catch(e){ $("#g_r").textContent="Greška: "+e.message; }
  };
}
function upute(){
  $("#main").innerHTML = `<h2>Upute</h2>
  <div class="card"><b>Tok:</b> priprema → saglasnost → snimanje (ili otprema audija) → obrada → pregled i ispravka → potvrda → arhiva i ispis.</div>
  <div class="card"><b>Zajednički sastanak uprave:</b> uz svaku tačku i zadatak bira se ustanova (IMH, IDSS ili zajedničko). Nakon potvrde moguće je ispisati izvod za IMH ili za IDSS; izvod sadrži samo tačke i zadatke te ustanove i zajedničke.</div>
  <div class="card"><b>Povjerljivost:</b> u Firebase načinu pristup određuju uloge po ustanovi (pravila pristupa u bazi). U DEMO načinu ta zaštita ne postoji.</div>
  <div class="card"><b>Ispis:</b> dugme „Ispis / PDF“ otvara ispis obrasca QP 10.ZS-01; u dijalogu odaberite „Sačuvaj kao PDF“.</div>
  <div class="card"><b>Način rada:</b> ${DEMO?"DEMO (podaci su samo u ovom pregledniku)":"povezano sa Firebase"}.</div>`;
}

window.addEventListener("beforeunload",e=>{ if(S.rec){ e.preventDefault(); e.returnValue=""; } });
init().catch(e=>{ $("#main").innerHTML=`<div class="note">Greška pri pokretanju: ${esc(e.message)}</div>`; });
</script>
